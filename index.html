<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Công việc</title>
    <script>
        // Tắt warning của Tailwind CDN (chỉ ảnh hưởng warning này)
        const _warn = console.warn.bind(console);
        console.warn = (...args) => { if (args[0] && String(args[0]).includes('cdn.tailwindcss.com')) return; _warn(...args); };
    </script>
    <script>tailwind = { config: {} }</script>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>tailwind.config = { corePlugins: { preflight: true } }</script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .hidden { display: none; }
        .modal-bg { background-color: rgba(0,0,0,0.6); z-index: 100; }
        #confirm-modal { z-index: 200; }
        .active-menu { background-color: #2563eb !important; border-left: 4px solid #fff; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .multi-select-box { max-height: 150px; overflow-y: auto; border: 1px solid #ddd; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <script>
        // Link API của bạn
        const API_URL = 'https://script.google.com/macros/s/AKfycbySPmJiCRiTzCTSpYkcg4WGYYggu9RcARxyt3SA-RZwMGlHeE20Ku87-LsrujyazcBhRA/exec';
    </script>

    <div id="login-screen" class="hidden min-h-screen flex items-center justify-center bg-slate-900">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-blue-600">
            <h2 class="text-3xl font-black mb-8 text-center text-slate-800 tracking-tight">TASK SYSTEM</h2>
            <div class="space-y-4">
                <input type="hidden" id="unit_name" value="ARITO">
                <input type="text" id="username" class="w-full p-3 border-2 rounded-xl focus:border-blue-500 outline-none transition" placeholder="Tên đăng nhập">
                <input type="password" id="password" class="w-full p-3 border-2 rounded-xl focus:border-blue-500 outline-none transition" placeholder="Mật khẩu">
                <button onclick="handleLogin()" id="login-btn" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold hover:bg-blue-700 shadow-lg transform active:scale-95 transition">ĐĂNG NHẬP</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden flex h-screen overflow-hidden">
        <div class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl">
            <div class="p-6 text-2xl font-black text-blue-400 border-b border-slate-800">TASK TRACKER</div>
            <nav id="sidebar-menu" class="flex-1 mt-4 px-3 space-y-2"></nav>
            <div class="p-4 bg-slate-800 border-t border-slate-700">
                <div id="user-display" class="font-bold text-blue-300"></div>
                <button onclick="logout()" class="text-red-400 hover:text-red-300 text-xs font-bold mt-2 uppercase tracking-widest">Đăng xuất</button>
            </div>
        </div>

        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow-sm p-5 border-b flex justify-between items-center">
                <h2 id="page-title" class="text-xl font-extrabold text-slate-700 uppercase tracking-tight"></h2>
                <div class="flex items-center gap-3">
                    <button id="notif-bell-btn" onclick="showDeadlinePanel()" class="relative w-10 h-10 rounded-xl bg-slate-50 hover:bg-amber-50 border border-slate-200 flex items-center justify-center transition" title="Thông báo deadline hôm nay">
                        <span class="text-xl">🔔</span>
                        <span id="notif-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-black rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1">0</span>
                    </button>
                </div>
            </header>
            <main class="flex-1 overflow-auto p-6 scrollbar-hide" id="main-content"></main>
        </div>
    </div>

    <div id="confirm-modal" class="modal-bg fixed inset-0 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
            <div class="w-16 h-16 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">!</div>
            <h3 id="confirm-title" class="text-xl font-bold mb-2">Xác nhận</h3>
            <p id="confirm-msg" class="text-gray-500 mb-6 text-sm"></p>
            <div class="flex space-x-3">
                <button onclick="closeConfirm(false)" class="flex-1 py-3 bg-gray-100 rounded-xl font-bold">Hủy</button>
                <button id="confirm-ok-btn" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg">Đồng ý</button>
            </div>
        </div>
    </div>

    <!-- Deadline Notification Panel -->
    <div id="deadline-panel" class="modal-bg fixed inset-0 hidden flex items-start justify-end p-4 pt-16" onclick="if(event.target===this)closeDeadlinePanel()">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm border overflow-hidden" onclick="event.stopPropagation()">
            <div class="bg-gradient-to-r from-amber-500 to-orange-500 p-4 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🔔</span>
                    <div>
                        <div class="font-black text-white text-sm">Deadline Hôm Nay</div>
                        <div id="notif-panel-date" class="text-amber-100 text-[10px]"></div>
                    </div>
                </div>
                <button onclick="closeDeadlinePanel()" class="text-white hover:text-amber-200 text-xl font-bold">✕</button>
            </div>
            <div id="notif-panel-body" class="max-h-96 overflow-y-auto divide-y"></div>
            <div class="p-3 bg-slate-50 border-t flex gap-2">
                <button onclick="requestNotifPermission()" id="notif-perm-btn" class="flex-1 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hidden">🔔 Bật thông báo trình duyệt</button>
                <button onclick="closeDeadlinePanel()" class="flex-1 py-2 bg-slate-200 rounded-xl text-xs font-bold">Đóng</button>
            </div>
        </div>
    </div>

    <!-- In-app toast notification -->
    <div id="deadline-toast" class="fixed bottom-6 right-6 hidden z-50 max-w-sm w-full">
        <div class="bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl shadow-2xl p-4 flex items-start gap-3">
            <span class="text-2xl flex-shrink-0">🔔</span>
            <div class="flex-1 min-w-0">
                <div class="font-black text-sm mb-1">Nhắc nhở deadline hôm nay!</div>
                <div id="toast-msg" class="text-xs text-amber-100"></div>
            </div>
            <button onclick="closeToast()" class="text-amber-200 hover:text-white flex-shrink-0">✕</button>
        </div>
    </div>

    <div id="modal-area"></div>

    <script>
        let SESSION = null;
        let ALL_TASKS = [];
        let MASTER_DATA = { projects: [], priorities: [], statuses: [], users: [] };
        let currentCalDate = new Date();
        let confirmCallback = null;
        let TASKS_DIRTY = true;
        let currentMenuId = null;

        function showConfirm(title, msg, callback) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-msg').innerText = msg;
            document.getElementById('confirm-modal').classList.remove('hidden');
            confirmCallback = callback;
            document.getElementById('confirm-ok-btn').onclick = () => { closeConfirm(true); };
        }
        function closeConfirm(isOk) {
            document.getElementById('confirm-modal').classList.add('hidden');
            if (isOk && confirmCallback) confirmCallback();
        }

        async function handleLogin() {
            const btn = document.getElementById('login-btn');
            btn.innerText = 'ĐANG ĐĂNG NHẬP...'; btn.disabled = true;
            const data = { action: 'login', data: {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                unit_name: document.getElementById('unit_name').value
            }};
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });
                const result = await res.json();
                if (result.status === 'success') {
                    SESSION = result;
                    localStorage.setItem('arito_qlcv_session', JSON.stringify(result));
                    initApp();
                } else {
                    alert("Sai thông tin đăng nhập!");
                    btn.innerText = 'ĐĂNG NHẬP'; btn.disabled = false;
                }
            } catch (e) {
                alert("Lỗi kết nối API. Vui lòng kiểm tra lại Link App Script.");
                btn.innerText = 'ĐĂNG NHẬP'; btn.disabled = false;
            }
        }

        async function initApp() {
            console.log('initApp - SESSION.menus:', JSON.stringify(SESSION.menus));
            console.log('initApp - sidebarEl sau render:', document.getElementById('sidebar-menu')?.innerHTML?.substring(0, 500));
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-display').innerText = SESSION.user.fullname;

            const isAdmin = SESSION.user.admin == 1 || SESSION.user.admin === true || SESSION.user.admin === '1';

            // Build sidebar menu bằng DOM API - tránh lỗi encoding/template literal
            const sidebarEl = document.getElementById('sidebar-menu');
            sidebarEl.innerHTML = '';

            // 1. Menu từ API (lọc bỏ các menu cố định)
            const excludedIds = ['10.05', '10.05.01', '10.05.02', '10.06'];
            (SESSION.menus || [])
                .filter(m => !excludedIds.includes(m.menu_id))
                .filter(m => m.menu_id !== '10.04' || isAdmin)
                .forEach(m => {
                    const a = document.createElement('a');
                    a.href = 'javascript:void(0)';
                    a.id = 'menu-' + m.menu_id;
                    a.className = 'sidebar-item flex items-center p-4 rounded-xl text-sm font-bold transition';
                    a.textContent = m.text;
                    a.onclick = () => switchMenu(m.menu_id, m.text);
                    sidebarEl.appendChild(a);
                });

            // 2. Menu 10.06 - Vắng mặt / Ra ngoài (cố định, luôn hiện)
            const a1006 = document.createElement('a');
            a1006.href = 'javascript:void(0)';
            a1006.id = 'menu-10.06';
            a1006.className = 'sidebar-item flex items-center p-4 rounded-xl text-sm font-bold transition';
            a1006.textContent = '🚪 Vắng mặt / Ra ngoài';
            a1006.onclick = () => switchMenu('10.06', 'Vắng mặt / Ra ngoài');
            sidebarEl.appendChild(a1006);

            // 3. Nhóm Báo cáo
            const reportGroup = document.createElement('div');
            reportGroup.className = 'mt-3 pt-3 border-t border-slate-700';
            reportGroup.innerHTML = '<div class="px-4 pb-1 text-[10px] font-black text-slate-500 uppercase tracking-widest">📊 Báo cáo</div>';

            const a1 = document.createElement('a');
            a1.href = 'javascript:void(0)';
            a1.id = 'menu-10.05.01';
            a1.className = 'sidebar-item flex items-center pl-6 pr-4 py-3 rounded-xl text-xs font-bold transition';
            a1.textContent = '📅 Thống kê thời gian cá nhân';
            a1.onclick = () => switchMenu('10.05.01', 'Thống kê thời gian làm việc cá nhân');
            reportGroup.appendChild(a1);

            if (isAdmin) {
                const a2 = document.createElement('a');
                a2.href = 'javascript:void(0)';
                a2.id = 'menu-10.05.02';
                a2.className = 'sidebar-item flex items-center pl-6 pr-4 py-3 rounded-xl text-xs font-bold transition';
                a2.textContent = '📈 Thống kê thời gian làm việc phòng';
                a2.onclick = () => switchMenu('10.05.02', 'Báo cáo tổng tình hình làm việc phòng');
                reportGroup.appendChild(a2);
            }
            sidebarEl.appendChild(reportGroup);
            console.log('sidebar HTML sau khi build:', sidebarEl.innerHTML.substring(0, 800));
            document.getElementById('page-title').innerText = 'Tổng hợp công việc';
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active-menu'));
            document.getElementById('menu-10.01')?.classList.add('active-menu');
            currentMenuId = '10.01';

            // Load cache ngay lập tức
            const cacheKeyMD = 'arito_master_data_' + SESSION.unit.unit_id;
            const cacheKeyTasks = 'arito_tasks_' + SESSION.unit.unit_id;
            let hasCachedTasks = false;
            try {
                const cachedMD = localStorage.getItem(cacheKeyMD);
                if (cachedMD) MASTER_DATA = JSON.parse(cachedMD);
                const cachedTasks = localStorage.getItem(cacheKeyTasks);
                if (cachedTasks) {
                    ALL_TASKS = JSON.parse(cachedTasks);
                    hasCachedTasks = true;
                }
            } catch(e) {}

            // Nếu có cache tasks -> render ngay, không cần chờ API
            if (hasCachedTasks) {
                TASKS_DIRTY = false;
                renderTable1001();
                checkAndNotifyDeadline();
            } else {
                // Chưa có cache -> hiện skeleton
                document.getElementById('main-content').innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border mb-6 animate-pulse">
                        <div class="flex gap-4"><div class="flex-1 h-10 bg-slate-100 rounded-xl"></div><div class="w-32 h-10 bg-slate-100 rounded-xl"></div><div class="w-32 h-10 bg-blue-100 rounded-xl"></div></div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        ${[1,2,3,4,5].map(() => `<div class="flex gap-4 p-5 border-b animate-pulse">
                            <div class="w-20 h-4 bg-slate-100 rounded"></div>
                            <div class="flex-1 space-y-2"><div class="h-4 bg-slate-100 rounded w-3/4"></div><div class="h-3 bg-slate-50 rounded w-1/3"></div></div>
                            <div class="w-20 h-4 bg-slate-100 rounded"></div>
                            <div class="w-24 h-4 bg-slate-100 rounded"></div>
                            <div class="w-16 h-6 bg-slate-100 rounded-full"></div>
                            <div class="w-20 h-6 bg-blue-50 rounded"></div>
                        </div>`).join('')}
                    </div>`;
            }

            // Fetch 2 API độc lập, cái nào xong trước thì cập nhật trước
            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getInitialData' }) })
                .then(r => r.json())
                .then(md => {
                    MASTER_DATA = md;
                    try { localStorage.setItem(cacheKeyMD, JSON.stringify(md)); } catch(e) {}
                })
                .catch(e => console.error('Lỗi getInitialData:', e));

            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getTasks', data: { unit_id: SESSION.unit.unit_id } }) })
                .then(r => r.json())
                .then(taskResult => {
                    ALL_TASKS = taskResult.data || [];
                    TASKS_DIRTY = false;
                    try { localStorage.setItem(cacheKeyTasks, JSON.stringify(ALL_TASKS)); } catch(e) {}
                    // Re-render chỉ nếu đang ở trang 10.01
                    if (currentMenuId === '10.01') renderTable1001();
                    checkAndNotifyDeadline();
                })
                .catch(e => console.error('Lỗi getTasks:', e));
        }

        async function switchMenu(menuId, text) {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active-menu'));
            document.getElementById(`menu-${menuId}`)?.classList.add('active-menu');
            document.getElementById('page-title').innerText = text;
            currentMenuId = menuId;

            if (TASKS_DIRTY) {
                const main = document.getElementById('main-content');
                main.innerHTML = '<div class="flex justify-center mt-20"><div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div></div>';
                try {
                    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getTasks', data: { unit_id: SESSION.unit.unit_id } })});
                    const result = await res.json();
                    ALL_TASKS = result.data || [];
                    TASKS_DIRTY = false;
                    checkAndNotifyDeadline();
                } catch(e) { console.error('Lỗi tải dữ liệu:', e); }
            }

            if (menuId === '10.01') renderTable1001();
            else if (menuId === '10.02') renderCalendar();
            else if (menuId === '10.03') renderDashboard();
            else if (menuId === '10.04') renderProjectList();
            else if (menuId === '10.05.01') renderReport100501();
            else if (menuId === '10.05.02') renderReport100502();
            else if (menuId === '10.06') await renderOutoffice();
        }

        // --- 10.01 TỔNG HỢP CÔNG VIỆC ---
        function renderTable1001() {
            const container = document.getElementById('main-content');
            const filtered = ALL_TASKS.filter(t => t.user_id == SESSION.user.user_id && (t.status == 0 || t.status == 3));

            container.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border mb-6">
                    <div class="flex flex-wrap gap-4 items-end">
                        <div class="flex-1 min-w-[200px]">
                            <label class="text-[10px] font-black text-slate-400 uppercase">Tìm kiếm nhanh</label>
                            <input type="text" id="quick_search" onkeyup="doQuickSearch()" placeholder="Tên việc, dự án..." class="w-full p-2.5 border-2 rounded-xl text-sm outline-none focus:border-blue-400">
                        </div>
                        <button onclick="toggleAdvance('task')" class="px-5 py-2.5 bg-slate-100 rounded-xl font-bold text-sm">Tìm nâng cao</button>
                        <button onclick="openTaskForm()" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl font-bold shadow-lg hover:shadow-blue-200">THÊM MỚI +</button>
                    </div>
                    
                    <div id="adv-filter-task" class="mt-6 pt-6 border-t" style="display:none; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem;">
                        <div class="space-y-1">
                            <label class="text-xs font-bold uppercase">Ngày tạo (Từ - Đến)</label>
                            <div class="flex gap-2"><input type="text" id="adv_c_start" class="date-mask w-full p-2 border rounded-lg text-xs" placeholder="DD/MM/YYYY" maxlength="10"><input type="text" id="adv_c_end" class="date-mask w-full p-2 border rounded-lg text-xs" placeholder="DD/MM/YYYY" maxlength="10"></div>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold uppercase">Ngày đến hạn (Từ - Đến)</label>
                            <div class="flex gap-2"><input type="text" id="adv_d_start" class="date-mask w-full p-2 border rounded-lg text-xs" placeholder="DD/MM/YYYY" maxlength="10"><input type="text" id="adv_d_end" class="date-mask w-full p-2 border rounded-lg text-xs" placeholder="DD/MM/YYYY" maxlength="10"></div>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold uppercase">Trạng thái (Chọn nhiều)</label>
                            <div class="multi-select-box text-xs" id="adv_st_list">
                                ${MASTER_DATA.statuses.map(s => `<label class="block p-1 hover:bg-gray-50"><input type="checkbox" value="${s.status_code}" ${(s.status_code == 0 || s.status_code == 3) ? 'checked' : ''}> ${s.status_name}</label>`).join('')}
                            </div>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold uppercase">Dự án</label>
                            <select id="adv_project" class="w-full p-2 border rounded-lg text-xs">
                                <option value="">-- Tất cả dự án --</option>
                                ${MASTER_DATA.projects.filter(p => p.status == 1).map(p => `<option value="${p.project_code}">${p.project_code} - ${p.project_name}</option>`).join('')}
                            </select>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold uppercase">Người thực hiện</label>
                            <select id="adv_user" class="w-full p-2 border rounded-lg text-xs">
                                <option value="">-- Tất cả người dùng --</option>
                                ${MASTER_DATA.users.map(u => `<option value="${u.user_id}">${u.username}</option>`).join('')}
                            </select>
                        </div>
                        <div class="flex items-end"><button onclick="applyTaskFilter()" class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold text-sm">ÁP DỤNG BỘ LỌC</button></div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b">
                            <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                <th class="p-5">Dự án</th>
                                <th class="p-5">Chi tiết công việc</th>
                                <th class="p-5 text-center">Bắt đầu</th>
                                <th class="p-5 text-center">Ngày đến hạn</th>
                                <th class="p-5 text-center">Trạng thái</th>
                                <th class="p-5 text-right">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y" id="task-table-body">${renderTaskRows(filtered)}</tbody>
                    </table>
                </div>`;
            initDateMasks();
        }

        function renderTaskRows(tasks) {
            return tasks.map(t => `
                <tr class="hover:bg-blue-50/50 cursor-pointer transition" onclick="openTaskForm(${JSON.stringify(t).replace(/"/g, '&quot;')})">
                    <td class="p-5 font-bold text-blue-600 text-sm">${t.project_code}</td>
                    <td class="p-5">
                        <div class="font-bold text-slate-800">${t.task_name}</div>
                        <div class="text-xs text-slate-400 font-medium">${getUserName(t.user_id)}</div>
                    </td>
                    <td class="p-5 text-center text-xs text-slate-500">${formatDate(t.start_date)}</td>
                    <td class="p-5 text-center text-xs font-black text-orange-600">${formatDate(t.due_date)}</td>
                    <td class="p-5 text-center">
                        <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${getStatusColor(t.status)}">${getStatusName(t.status)}</span>
                    </td>
                    <td class="p-5 text-right space-x-1" onclick="event.stopPropagation()">
                        ${t.status == 0 ? `<button onclick="doQuickStart('${t.id}')" class="bg-blue-500 text-white px-3 py-1 rounded-lg text-[10px] font-black shadow-lg">BẮT ĐẦU</button>` : ''}
                        ${t.status == 3 ? `<button onclick="doQuickDone('${t.id}')" class="bg-emerald-500 text-white px-3 py-1 rounded-lg text-[10px] font-black shadow-lg">XONG</button>` : (t.status == 5 ? '✅' : '')}
                    </td>
                </tr>
            `).join('');
        }

        function applyTaskFilter() {
            try {
                const stList = Array.from(document.querySelectorAll('#adv_st_list input:checked')).map(i => i.value);
                const cStart = document.getElementById('adv_c_start').value;
                const cEnd = document.getElementById('adv_c_end').value;
                const dStart = document.getElementById('adv_d_start').value;
                const dEnd = document.getElementById('adv_d_end').value;
                const projectCode = document.getElementById('adv_project').value;
                const userId = document.getElementById('adv_user').value;

                const filtered = ALL_TASKS.filter(t => {
                    const matchStatus = stList.length === 0 || stList.includes(String(t.status));
                    const matchProject = !projectCode || t.project_code === projectCode;

                            if (cEnd)   { const de = parseLocalDate(cEnd);   if (de && dateC > de) matchC = false; }

        function renderCalendarGrid(tasksToDisplay) {
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Cập nhật tiêu đề tháng nếu đang có sẵn
            const titleEl = document.getElementById('cal-month-title');
            if (titleEl) titleEl.textContent = `THÁNG ${month+1} / ${year}`;

            const wrapper = document.getElementById('cal-grid-wrapper');
            if (!wrapper) return;

            wrapper.innerHTML = `
                <div class="grid grid-cols-7 gap-px bg-slate-200 border rounded-xl overflow-hidden shadow-inner">
                    ${['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'].map(d => `<div class="bg-slate-50 p-3 text-center font-black text-[10px] text-slate-400">${d}</div>`).join('')}
                    ${Array(firstDay).fill('').map(() => `<div class="bg-slate-50 p-2 min-h-[8rem]"></div>`).join('')}
                    ${Array.from({length: daysInMonth}, (_, i) => {
                        const d = i + 1;
                        const dStr = `${year}-${(month+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
                        const cellDate = new Date(year, month, d);
                        const todayMid = new Date(); todayMid.setHours(0,0,0,0);
                        const isOverdueCell = cellDate < todayMid;
                        const dayTasks = tasksToDisplay.filter(t => {
                            if (!t.due_date) return false;
                            const ld = parseLocalDate(t.due_date);
                            if (!ld) return false;
                            return ld.getFullYear() === year && ld.getMonth() === month && ld.getDate() === d;
                        });
                        return `<div class="bg-white p-2 min-h-[8rem] border-t hover:bg-blue-50/50 cursor-pointer">
                            <div class="text-xs font-black mb-1 ${(d == new Date().getDate() && month == new Date().getMonth() && year == new Date().getFullYear()) ? 'text-blue-600 bg-blue-50 w-6 h-6 flex items-center justify-center rounded-full' : ''}">${d}</div>

        // --- CÁC HÀM CÔNG VIỆC KHÁC ---
        function isValidDate(str) {
            // Kiểm tra DD/MM/YYYY hợp lệ đầy đủ
            if (!str) return false;
            const parts = str.split('/');
            if (parts.length !== 3) return false;
            const [d, m, y] = parts.map(Number);
            if (!d || !m || !y || y < 1000 || y > 9999) return false;
            if (m < 1 || m > 12) return false;
            if (d < 1 || d > 31) return false;
            const dt = new Date(y, m - 1, d);
            return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
        }

            }
        }

        // Parse datetime0 format: "DD/MM/YYYY H:MM:SS" -> Date object
        function parseDatetime0(str) {
            if (!str) return null;
            // Thử ISO trước (fallback)
            if (str.includes('T')) return new Date(str);
            // Format: DD/MM/YYYY H:MM:SS
            const parts = str.trim().split(' ');
            if (parts.length < 2) return null;
            const [d, m, y] = parts[0].split('/').map(Number);
            const [hh, mm, ss] = parts[1].split(':').map(Number);
            if (!d || !m || !y) return null;
            return new Date(y, m - 1, d, hh || 0, mm || 0, ss || 0);
        }

        function parseLocalDate(str) {
            if (!str) return null;
            // Support DD/MM/YYYY format from text inputs
            if (str.includes('/')) {
                const [d, m, y] = str.split('/').map(Number);
                if (!d || !m || !y || y < 1000) return null;
                return new Date(y, m - 1, d);
            }
            // Nếu chuỗi có timezone (kết thúc Z hoặc có +/-HH:MM),
            // convert sang local time trước khi lấy ngày, tránh lệch múi giờ UTC
            if (str.includes('T') && (str.endsWith('Z') || /[+-]\d{2}:\d{2}$/.test(str))) {
                const localDate = new Date(str);
                return new Date(localDate.getFullYear(), localDate.getMonth(), localDate.getDate());
            }
            // Format YYYY-MM-DD hoặc YYYY-MM-DDTHH:MM:SS (không có timezone) -> parse trực tiếp
            const [y, m, d] = str.split('T')[0].split('-').map(Number);
            return new Date(y, m - 1, d);
        }
        function applyDateMask(input) {
            if (input._dateMaskApplied) return;
            input._dateMaskApplied = true;

            // Chuẩn hoá chuỗi digits thành DD/MM/YYYY
            function buildMasked(digits) {
                // digits: tối đa 8 ký tự số
                let d = digits.slice(0, 8);
                let out = d.slice(0, 2);
                if (d.length > 2) out += '/' + d.slice(2, 4);
                if (d.length > 4) out += '/' + d.slice(4, 8);
                return out;
            }

            // Lấy số chữ số trước vị trí pos trong chuỗi đã có mask
            function digitsBefore(str, pos) {
                return str.slice(0, pos).replace(/\D/g, '').length;
            }

            // Tìm vị trí con trỏ trong masked string tương ứng với nDigits chữ số
            function posAfterNDigits(masked, n) {
                let count = 0;
                for (let i = 0; i < masked.length; i++) {
                    if (/\d/.test(masked[i])) { count++; if (count === n) return i + 1; }
                }
                return masked.length;
            }

            input.addEventListener('beforeinput', function(e) {
                const v   = this.value;
                const s   = this.selectionStart;
                const end = this.selectionEnd;

                if (e.inputType === 'insertText') {
                    const ch = e.data;
                    if (!ch || !/\d/.test(ch)) { e.preventDefault(); return; }

                    // Lấy digits hiện tại, xoá phần được chọn, chèn digit mới vào đúng chỗ
                    const digitsBeforeS   = digitsBefore(v, s);
                    const digitsBeforeEnd = digitsBefore(v, end);
                    const allDigits = v.replace(/\D/g, '');
                    const newDigits = allDigits.slice(0, digitsBeforeS) + ch + allDigits.slice(digitsBeforeEnd);
                    if (newDigits.length > 8) { e.preventDefault(); return; }

                    const masked = buildMasked(newDigits);
                    e.preventDefault();
                    this.value = masked;
                    // Con trỏ đặt sau digit vừa chèn
                    const newPos = posAfterNDigits(masked, digitsBeforeS + 1);
                    this.setSelectionRange(newPos, newPos);

                } else if (e.inputType === 'deleteContentBackward') {
                    e.preventDefault();
                    const allDigits = v.replace(/\D/g, '');
                    if (s === end) {
                        // Không có selection: xoá digit ngay trước con trỏ
                        const n = digitsBefore(v, s);
                        if (n === 0) return;
                        const newDigits = allDigits.slice(0, n - 1) + allDigits.slice(n);
                        const masked = buildMasked(newDigits);
                        this.value = masked;
                        const newPos = posAfterNDigits(masked, n - 1);
                        this.setSelectionRange(newPos, newPos);
                    } else {
                        // Có selection: xoá vùng được chọn
                        const ds = digitsBefore(v, s);
                        const de = digitsBefore(v, end);
                        const newDigits = allDigits.slice(0, ds) + allDigits.slice(de);
                        const masked = buildMasked(newDigits);
                        this.value = masked;
                        const newPos = posAfterNDigits(masked, ds);
                        this.setSelectionRange(newPos, newPos);
                    }

                } else if (e.inputType === 'deleteContentForward') {
                    e.preventDefault();
                    const allDigits = v.replace(/\D/g, '');
                    if (s === end) {
                        // Xoá digit ngay sau con trỏ
                        const n = digitsBefore(v, s);
                        if (n >= allDigits.length) return;
                        const newDigits = allDigits.slice(0, n) + allDigits.slice(n + 1);
                        const masked = buildMasked(newDigits);
                        this.value = masked;
                        const newPos = posAfterNDigits(masked, n) || 0;
                        this.setSelectionRange(newPos, newPos);
                    } else {
                        const ds = digitsBefore(v, s);
                        const de = digitsBefore(v, end);
                        const newDigits = allDigits.slice(0, ds) + allDigits.slice(de);
                        const masked = buildMasked(newDigits);
                        this.value = masked;
                        const newPos = posAfterNDigits(masked, ds);
                        this.setSelectionRange(newPos, newPos);
                    }
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Tab') { autoFillDate(this); }
            });

            input.addEventListener('blur', function() { autoFillDate(this); });
        }
        function autoFillDate(input) {
            const now = new Date();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();
            let v = input.value.trim();
            if (!v) return;
            // Chỉ có ngày (1-2 ký tự số, hoặc DD)
            const digits = v.replace(/\D/g, '');
            if (digits.length <= 2 && !v.includes('/')) {
                // Chỉ có ngày -> tự điền tháng/năm hiện tại
                const dd = digits.padStart(2, '0');
                input.value = `${dd}/${mm}/${yyyy}`;
            } else if (v.match(/^\d{1,2}\/\d{1,2}$/) || digits.length === 4 && v.includes('/')) {
                // Có ngày/tháng nhưng chưa có năm -> tự điền năm hiện tại
                const parts = v.split('/');
                const dd = parts[0].padStart(2, '0');
                const mo = parts[1].padStart(2, '0');
                input.value = `${dd}/${mo}/${yyyy}`;
            }
        }

        function getReport100502Data(fromStr, toStr) {
            const fromDate = parseLocalDate(fromStr);
            const toDate   = parseLocalDate(toStr);
            const filtered = ALL_TASKS.filter(t => {
                if (t.status != 5) return false;
                if (!t.finish_date) return false;
                const fd = parseDatetime0(t.finish_date);
                if (!fd) return false;
                const fdDate = new Date(fd.getFullYear(), fd.getMonth(), fd.getDate());
                if (fromDate && fdDate < fromDate) return false;
                if (toDate   && fdDate > toDate)   return false;
                return true;
            });
            const grouped = {};
            filtered.forEach(t => {
                const fd = parseDatetime0(t.finish_date);
                const dayKey = fd.getFullYear() + '-' + (fd.getMonth()+1).toString().padStart(2,'0') + '-' + fd.getDate().toString().padStart(2,'0');
                const key = t.user_id + '__' + dayKey;
                if (!grouped[key]) grouped[key] = { user_id: t.user_id, dayKey, tasks: [] };
                grouped[key].tasks.push(t);
            });
            return Object.values(grouped).sort((a,b) => {
                const ua = getUserName(a.user_id), ub = getUserName(b.user_id);
                if (ua < ub) return -1; if (ua > ub) return 1;
                return a.dayKey.localeCompare(b.dayKey);
            });
        }

        // Retry fetch với exponential backoff
        async function fetchWithRetry(url, options, retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url, options);
                    const result = await res.json();
                    return result;
                } catch(e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, 300 * Math.pow(2, i)));
                }
            }
        }

                                const isToday = (d == new Date().getDate() && month == new Date().getMonth() && year == new Date().getFullYear());
                                const dayRecs = byDate[dStr] || [];
                                return `<div class="bg-white p-2 min-h-[8rem] border-t hover:bg-blue-50/50 cursor-pointer" onclick="openOutofficeFormWithDate('${dStr}', event)">
                                    <div class="text-xs font-black mb-1 ${isToday ? 'text-blue-600 bg-blue-50 w-6 h-6 flex items-center justify-center rounded-full' : ''}">${d}</div>

                            }).join('')}
                        </div>
                    </div>

                    <!-- Danh sách tất cả mọi người trong tháng -->
                    <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <div class="p-4 border-b bg-orange-50 flex items-center gap-2">
                            <span class="text-lg">🚪</span>
                            <h4 class="font-black text-orange-700 uppercase text-xs">Tất cả vắng mặt tháng ${(month+1)}/${year} (${allMonthRecs.length} lượt)</h4>
                        </div>
                        <div class="overflow-auto max-h-80">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 border-b">
                                    <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                        <th class="p-3">Nhân viên</th>
                                        <th class="p-3 text-center">Ngày</th>
                                        <th class="p-3 text-center">Giờ từ</th>
                                        <th class="p-3 text-center">Giờ đến</th>
                                        <th class="p-3">Diễn giải</th>
                                        <th class="p-3 text-right">Thao tác</th>
                                    </tr>

                                <tbody class="divide-y">
                                    ${allMonthRecs.length === 0
                                        ? `<tr><td colspan="6" class="p-6 text-center text-slate-400 text-xs">✅ Không có vắng mặt nào trong tháng này</td></tr>`
                                        : allMonthRecs.sort((a,b) => {
                                            const da = normOutofficeDate(a.date), db = normOutofficeDate(b.date);
                                            return da.localeCompare(db);
                                        }).map(rec => `
                                        <tr class="hover:bg-orange-50/40 cursor-pointer" onclick="openOutofficeForm(${JSON.stringify(rec).replace(/"/g,'&quot;')})">
                                            <td class="p-3 font-bold text-slate-700 text-sm">${getUserName(rec.user_id)}</td>
                                            <td class="p-3 text-center text-xs text-slate-600">${formatOutofficeDate(rec.date)}</td>
                                            <td class="p-3 text-center text-xs text-slate-600">${formatOutofficeTime(rec.from_hour) || '-'}</td>
                                            <td class="p-3 text-center text-xs text-slate-600">${formatOutofficeTime(rec.to_hour) || '-'}</td>
                                            <td class="p-3 text-xs text-slate-500 max-w-xs truncate">${rec.descript || '-'}</td>
                                            <td class="p-3 text-right" onclick="event.stopPropagation()">
                                                <button onclick="doDeleteOutoffice('${rec.id}')" class="text-red-500 hover:text-red-700 font-bold text-xs px-2 py-1 rounded-lg hover:bg-red-50">Xóa</button>
                                            </td>
                                        </tr>`).join('')
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
        }

        function formatOutofficeTime(t) {
            if (!t) return '';
            if (typeof t === 'string' && t.includes('T')) {
                const dt = new Date(t);
                return `${dt.getHours().toString().padStart(2,'0')}:${dt.getMinutes().toString().padStart(2,'0')}`;
            }
            if (t instanceof Date) {
                return `${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}`;
            }
            return t;
        }

        // Parse ngày outoffice về YYYY-MM-DD theo giờ Việt Nam (UTC+7)
        // Tránh lỗi lệch ngày khi API trả ISO string dạng UTC (e.g. 2025-05-07T17:00:00Z = 08/05 VN)
        function parseOutofficeDateVN(d) {
            if (!d) return '';
            if (d instanceof Date) {
                // Cộng offset +7h rồi lấy ngày
                const vn = new Date(d.getTime() + 7 * 3600000);
                return vn.toISOString().slice(0, 10);
            }
            if (typeof d === 'string') {
                // Dạng DD/MM/YYYY
                if (d.includes('/')) {
                    const [dd, mm, yyyy] = d.split('/');
                    return `${yyyy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
                }
                // Dạng ISO có timezone offset, e.g. 2025-05-08T00:00:00+07:00
                if (d.includes('+') && d.includes('T')) {
                    // Lấy phần date trước T - đây chính là ngày local
                    return d.split('T')[0];
                }
                // Dạng ISO UTC, e.g. 2025-05-07T17:00:00.000Z -> cộng 7h
                if (d.endsWith('Z') || (d.includes('T') && !d.includes('+'))) {
                    const ms = Date.parse(d);
                    if (!isNaN(ms)) {
                        const vn = new Date(ms + 7 * 3600000);
                        return vn.toISOString().slice(0, 10);
                    }
                }
                // Dạng YYYY-MM-DD thuần
                return d.split('T')[0];
            }
            return '';
        }

        function normOutofficeDate(d) {
            return parseOutofficeDateVN(d);
        }

        function formatOutofficeDate(d) {
            if (!d) return '-';
            const ymd = parseOutofficeDateVN(d);
            if (!ymd || ymd.length < 10) return '-';
            const [y, m, dd] = ymd.split('-');
            if (parseInt(y) <= 1900) return '-';
            return `${dd}/${m}/${y}`;
        }

        function changeOutofficeMonth(s) {
            currentOutofficeDate.setMonth(currentOutofficeDate.getMonth() + s);
            renderOutofficeCalendar();
        }

        function openOutofficeFormWithDate(dateStr, event) {
            // dateStr dạng YYYY-MM-DD
            const [y, m, d] = dateStr.split('-');
            const prefilled = { _prefillDate: `${d}/${m}/${y}` };
            openOutofficeForm(null, prefilled);
        }

        function openOutofficeForm(rec = null, prefill = null) {
            const isEdit = !!rec;
            const today = new Date();
            const defaultDate = today.getDate().toString().padStart(2,'0') + '/' + (today.getMonth()+1).toString().padStart(2,'0') + '/' + today.getFullYear();
            const currentDateVal = isEdit ? formatOutofficeDate(rec.date) : (prefill?._prefillDate || defaultDate);

            const html = `
                <div id="outoffice-modal" class="modal-bg fixed inset-0 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                        <div class="p-5 bg-slate-900 text-white font-black flex justify-between uppercase tracking-widest">
                            <span>🚪 ${isEdit ? 'Sửa lịch vắng mặt' : 'Thêm lịch vắng mặt'}</span>
                            <button onclick="closeModal('outoffice-modal')">&times;</button>
                        </div>
                        <form id="form-outoffice" class="p-6 space-y-5">
                            <input type="hidden" name="id" value="${rec?.id || ''}">

                            <div>
                                <label class="text-[10px] font-black uppercase text-slate-400">Ngày *</label>
                                <input type="text" name="date" required class="date-mask w-full p-3 border-2 rounded-xl outline-none focus:border-blue-400 mt-1" placeholder="DD/MM/YYYY" maxlength="10" value="${currentDateVal}">
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-[10px] font-black uppercase text-slate-400">Giờ từ *</label>
                                    <input type="text" data-format="24h" name="from_hour" required class="w-full p-3 border-2 rounded-xl outline-none focus:border-blue-400 mt-1" placeholder="HH:MM" maxlength="5" value="${formatOutofficeTime(rec?.from_hour) || '08:00'}" oninput="maskTime(this)">
                                </div>
                                <div>
                                    <label class="text-[10px] font-black uppercase text-slate-400">Giờ đến *</label>
                                    <input type="text" data-format="24h" name="to_hour" required class="w-full p-3 border-2 rounded-xl outline-none focus:border-blue-400 mt-1" placeholder="HH:MM" maxlength="5" value="${formatOutofficeTime(rec?.to_hour) || '17:00'}" oninput="maskTime(this)">
                                </div>
                            </div>

                            <div>
                                <label class="text-[10px] font-black uppercase text-slate-400">Diễn giải</label>
                                <textarea name="descript" rows="3" class="w-full p-3 border-2 rounded-xl outline-none focus:border-blue-400 mt-1 resize-none" placeholder="Nhập lý do vắng mặt / ra ngoài...">${rec?.descript || ''}</textarea>
                            </div>

                            <div class="flex justify-between items-center pt-4 border-t">
                                ${isEdit
                                    ? `<button type="button" onclick="doDeleteOutoffice('${rec.id}', true)" class="px-5 py-3 bg-red-100 text-red-600 rounded-xl font-bold hover:bg-red-200 transition">Xóa dòng</button>`
                                    : '<div></div>'}
                                <div class="flex gap-3">
                                    <button type="button" onclick="closeModal('outoffice-modal')" class="px-6 py-3 bg-gray-100 rounded-xl font-bold">Hủy</button>
                                    <button type="submit" id="btn-save-outoffice" class="px-8 py-3 bg-blue-600 text-white rounded-xl font-black shadow-lg shadow-blue-200">Lưu</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>`;

            document.getElementById('modal-area').innerHTML = html;
            initDateMasks();

            document.getElementById('form-outoffice').onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btn-save-outoffice');
                btn.innerText = 'Đang lưu...'; btn.disabled = true;

                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                if (data.date && data.date.includes('/')) {
                    const [d, m, y] = data.date.split('/');
                    data.date = `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
                }

                data.unit_id = SESSION.unit.unit_id;
                data.user_id = SESSION.user.user_id;

                const now = new Date();
                const nowStr = `${now.getDate().toString().padStart(2,'0')}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getFullYear()} ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;

                const isNew = !data.id;
                if (isNew) {
                    data.user_id0 = SESSION.user.user_id;
                    data.datetime0 = nowStr;
                }
                data.user_id2 = SESSION.user.user_id;
                data.datetime2 = nowStr;

                // Optimistic update: cập nhật local cache ngay, đóng modal
                const tempId = data.id || ('tmp_' + Date.now());
                if (isNew) {
                    data._tempId = tempId;
                    ALL_OUTOFFICE.push({ ...data, id: tempId });
                } else {
                    const idx = ALL_OUTOFFICE.findIndex(r => String(r.id) === String(data.id));
                    if (idx > -1) ALL_OUTOFFICE[idx] = { ...ALL_OUTOFFICE[idx], ...data };
                }
                closeModal('outoffice-modal');
                renderOutofficeCalendar();

                // Gọi API trong queue để tránh conflict
                queueOutofficeWrite(async () => {
                    try {
                        const result = await fetchWithRetry(API_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'saveOutOffice', data })
                        });
                        if (result.status === 'success') {
                            // Cập nhật id thật từ server
                            if (isNew && result.id) {
                                const idx = ALL_OUTOFFICE.findIndex(r => r.id === tempId || r._tempId === tempId);
                                if (idx > -1) { ALL_OUTOFFICE[idx].id = result.id; delete ALL_OUTOFFICE[idx]._tempId; }
                            }
                        } else {
                            // Rollback nếu lỗi
                            if (isNew) ALL_OUTOFFICE = ALL_OUTOFFICE.filter(r => r._tempId !== tempId && r.id !== tempId);
                            else OUTOFFICE_DIRTY = true;
                            alert('Lỗi lưu: ' + (result.message || 'Không xác định'));
                            renderOutofficeCalendar();
                        }
                    } catch(err) {
                        if (isNew) ALL_OUTOFFICE = ALL_OUTOFFICE.filter(r => r._tempId !== tempId && r.id !== tempId);
                        else OUTOFFICE_DIRTY = true;
                        alert('Lỗi kết nối khi lưu. Vui lòng thử lại.');
                        renderOutofficeCalendar();
                    }
                });
            };
        }

        function doDeleteOutoffice(id, fromModal = false) {
            showConfirm('Xóa vắng mặt', 'Bạn muốn xóa dòng vắng mặt này?', () => {
                if (fromModal) closeModal('outoffice-modal');

                // Optimistic: xóa khỏi cache ngay
                const backup = ALL_OUTOFFICE.find(r => String(r.id) === String(id));
                ALL_OUTOFFICE = ALL_OUTOFFICE.filter(r => String(r.id) !== String(id));
                renderOutofficeCalendar();

                queueOutofficeWrite(async () => {
                    try {
                        const result = await fetchWithRetry(API_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'deleteOutOffice', data: { id } })
                        });
                        if (result.status !== 'success') {
                            // Rollback
                            if (backup) ALL_OUTOFFICE.push(backup);
                            alert('Lỗi xóa: ' + (result.message || 'Không xác định'));
                            renderOutofficeCalendar();
                        }
                    } catch(e) {
                        if (backup) ALL_OUTOFFICE.push(backup);
                        alert('Lỗi kết nối khi xóa. Vui lòng thử lại.');
                        renderOutofficeCalendar();
                    }
                });
            });
        }

        function maskTime(input) {
            let v = input.value.replace(/[^0-9]/g, '');
            if (v.length >= 3) v = v.slice(0,2) + ':' + v.slice(2,4);
            input.value = v;
            // Validate range
            if (v.length === 5) {
                const [h, m] = v.split(':').map(Number);
                if (h > 23) input.value = '23:' + v.slice(3);
                if (m > 59) input.value = v.slice(0,3) + '59';
            }
        }

        function logout() {
            const uid = SESSION?.unit?.unit_id;
            localStorage.removeItem('arito_qlcv_session');
            if (uid) localStorage.removeItem('arito_tasks_' + uid);
            location.reload();
        }

        // Khôi phục session khi F5 / mở lại tab
        (function restoreSession() {
            try {
                const saved = localStorage.getItem('arito_qlcv_session');
                if (saved) {
                    SESSION = JSON.parse(saved);
                    if (SESSION && SESSION.status === 'success' && SESSION.user && SESSION.unit) {
                        // Hiện app ngay, tránh màn trắng trong khi await initApp
                        document.getElementById('login-screen').classList.add('hidden');
                        document.getElementById('main-app').classList.remove('hidden');
                        initApp().catch(console.error);
                        return;
                    }
                }
            } catch(e) {}
            // Không có session hợp lệ -> hiển thị màn hình đăng nhập
            document.getElementById('login-screen').classList.remove('hidden');
        })();

        // =============================================
        // DEADLINE NOTIFICATION SYSTEM
        // =============================================

        // =============================================
        // NOTIFICATION READ STATE (localStorage)
        // =============================================
        function _notiKey(type) {
            return 'noti_read_' + type + '_' + (SESSION?.user?.user_id || '');
        }
        function getReadIds(type) {
            try { return new Set(JSON.parse(localStorage.getItem(_notiKey(type)) || '[]')); } catch { return new Set(); }
        }
        function markRead(type, id) {
            const ids = getReadIds(type);
            ids.add(String(id));
            localStorage.setItem(_notiKey(type), JSON.stringify([...ids]));
        }
        function markAllRead(type, ids) {
            const existing = getReadIds(type);
            ids.forEach(id => existing.add(String(id)));
            localStorage.setItem(_notiKey(type), JSON.stringify([...existing]));
        }
        function isRead(type, id) { return getReadIds(type).has(String(id)); }

        function getTodayDeadlineTasks() {
            const today = new Date();
            const todayStr = today.getFullYear() + '-'
                + (today.getMonth()+1).toString().padStart(2,'0') + '-'
                + today.getDate().toString().padStart(2,'0');
            return ALL_TASKS.filter(t => {
                if (String(t.user_id) !== String(SESSION.user.user_id)) return false;
                if (t.status == 5) return false;
                if (!t.due_date) return false;
                const due = t.due_date.split('T')[0];
                return due === todayStr;
            });
        }

        function getNewAssignedTasks() {
            return ALL_TASKS.filter(t => {
                if (t.status == 5) return false;
                if (String(t.user_id) !== String(SESSION.user.user_id)) return false;
                if (!t.user_id0) return false;
                if (isRead('assigned', t.id)) return false;
                return String(t.user_id0) !== String(t.user_id);
            });
        }

        function getUpcomingNotiTasks() {
            const today = new Date(); today.setHours(0,0,0,0);
            const limit = new Date(today); limit.setDate(limit.getDate() + 3);
            return ALL_TASKS.filter(t => {
                if (t.status == 5) return false;
                if (String(t.user_id) === String(SESSION.user.user_id)) return false;
                if (!t.due_date || !t.noti_user) return false;
                if (isRead('noti', t.id)) return false;
                const notiIds = String(t.noti_user).split(',').map(x => x.trim());
                if (!notiIds.includes(String(SESSION.user.user_id))) return false;
                const d = new Date(t.due_date.split('T')[0]);
                return d >= today && d <= limit;
            });
        }

        function updateBellBadge() {
            const tasks = getTodayDeadlineTasks().filter(t => !isRead('deadline', t.id));
            const notiTasks = getUpcomingNotiTasks();
            const newAssigned = getNewAssignedTasks();
            const badge = document.getElementById('notif-badge');
            if (!badge) return;
            const total = tasks.length + notiTasks.length + newAssigned.length;
            if (total > 0) {
                badge.textContent = total;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function showDeadlinePanel() {
            const allDeadline  = getTodayDeadlineTasks();
            const notiTasks    = getUpcomingNotiTasks();
            const newAssigned  = getNewAssignedTasks();
            // deadline: chia thành chưa đọc / đã đọc
            const unreadDL  = allDeadline.filter(t => !isRead('deadline', t.id));
            const readDL    = allDeadline.filter(t =>  isRead('deadline', t.id));

            const today = new Date();
            const dateStr = today.getDate().toString().padStart(2,'0') + '/'
                + (today.getMonth()+1).toString().padStart(2,'0') + '/' + today.getFullYear();
            document.getElementById('notif-panel-date').textContent = dateStr;

            const body = document.getElementById('notif-panel-body');
            let html = '';

            const totalUnread = unreadDL.length + notiTasks.length + newAssigned.length;

            if (allDeadline.length === 0 && notiTasks.length === 0 && newAssigned.length === 0) {
                body.innerHTML = '<div class="p-6 text-center text-slate-400 text-sm">&#127881; Không có thông báo nào!</div>';
                document.getElementById('deadline-panel').classList.remove('hidden');
                return;
            }

            // helper: nút đánh dấu đã đọc từng item
            const readBtn = (type, id) =>
                '<button onclick="event.stopPropagation();markNotiRead(\'' + type + '\',\'' + id + '\')" '
                + 'class="flex-shrink-0 text-[10px] text-slate-400 hover:text-slate-600 border border-slate-200 rounded-lg px-2 py-1 ml-2 whitespace-nowrap">Đã đọc</button>';

            // --- Công việc mới được giao ---
            if (newAssigned.length > 0) {
                html += '<div class="px-4 py-2 bg-green-50 flex items-center justify-between border-b">'
                    + '<span class="text-[10px] font-black text-green-700 uppercase tracking-widest">Công việc mới được giao</span>'
                    + '<button onclick="markAllNotiRead(\'assigned\',[' + newAssigned.map(t=>'\''+t.id+'\'').join(',') + '])" class="text-[10px] text-green-600 font-bold hover:underline">Đọc tất cả</button>'
                    + '</div>';
                html += newAssigned.map(t => {
                    const creatorName = getUserName(t.user_id0);
                    return '<div class="p-4 hover:bg-green-50/50 transition border-b last:border-0">'
                        + '<div class="flex items-start gap-2">'
                        + '<div class="w-2 h-2 rounded-full bg-green-500 mt-2 flex-shrink-0"></div>'
                        + '<div class="flex-1 min-w-0 cursor-pointer" onclick="closeDeadlinePanel();openTaskForm(' + JSON.stringify(t).replace(/"/g,'&quot;') + ')">'
                        + '<div class="font-bold text-slate-800 text-sm">Bạn vừa nhận được công việc mới từ ' + creatorName + '</div>'
                        + '<div class="text-xs text-slate-500 mt-0.5 truncate">' + t.task_name + ' – ' + t.project_code + '</div>'
                        + '</div>'
                        + readBtn('assigned', t.id)
                        + '</div></div>';
                }).join('');
            }

            // --- Deadline hôm nay chưa đọc ---
            if (unreadDL.length > 0) {
                html += '<div class="px-4 py-2 bg-orange-50 flex items-center justify-between border-b border-t">'
                    + '<span class="text-[10px] font-black text-orange-600 uppercase tracking-widest">Deadline hôm nay</span>'
                    + '<button onclick="markAllNotiRead(\'deadline\',[' + unreadDL.map(t=>'\''+t.id+'\'').join(',') + '])" class="text-[10px] text-orange-600 font-bold hover:underline">Đọc tất cả</button>'
                    + '</div>';
                html += unreadDL.map(t => {
                    const statusColors = { 0: 'bg-gray-100 text-gray-600', 3: 'bg-blue-100 text-blue-700' };
                    const cls = statusColors[t.status] || 'bg-gray-100 text-gray-600';
                    return '<div class="p-4 hover:bg-amber-50/50 transition border-b last:border-0">'
                        + '<div class="flex items-start gap-2">'
                        + '<div class="w-2 h-2 rounded-full bg-orange-400 mt-2 flex-shrink-0"></div>'
                        + '<div class="flex-1 min-w-0 cursor-pointer" onclick="closeDeadlinePanel();openTaskForm(' + JSON.stringify(t).replace(/"/g,'&quot;') + ')">'
                        + '<div class="font-bold text-slate-800 text-sm truncate">' + t.task_name + '</div>'
                        + '<div class="text-xs text-slate-400 mt-0.5">' + t.project_code + '</div>'
                        + '<span class="inline-block mt-1 px-2 py-0.5 rounded-full text-[9px] font-black uppercase ' + cls + '">' + getStatusName(t.status) + '</span>'
                        + '</div>'
                        + readBtn('deadline', t.id)
                        + '</div></div>';
                }).join('');
            }

            // --- Deadline đã đọc (thu gọn) ---
            if (readDL.length > 0) {
                html += '<details class="border-t"><summary class="px-4 py-2 bg-slate-50 text-[10px] font-black text-slate-400 uppercase cursor-pointer select-none">Đã đọc (' + readDL.length + ')</summary>';
                html += readDL.map(t => {
                    return '<div class="p-3 opacity-50 border-b last:border-0 cursor-pointer hover:opacity-80 transition" onclick="closeDeadlinePanel();openTaskForm(' + JSON.stringify(t).replace(/"/g,'&quot;') + ')">'
                        + '<div class="flex items-center gap-2">'
                        + '<div class="w-2 h-2 rounded-full bg-slate-300 flex-shrink-0"></div>'
                        + '<div class="flex-1 min-w-0">'
                        + '<div class="text-xs font-bold text-slate-600 truncate">' + t.task_name + '</div>'
                        + '<div class="text-[10px] text-slate-400">' + t.project_code + '</div>'
                        + '</div></div></div>';
                }).join('');
                html += '</details>';
            }

            // --- Sắp đến hạn (noti_user) ---
            if (notiTasks.length > 0) {
                html += '<div class="px-4 py-2 bg-purple-50 flex items-center justify-between border-t">'
                    + '<span class="text-[10px] font-black text-purple-600 uppercase tracking-widest">Sắp đến hạn</span>'
                    + '<button onclick="markAllNotiRead(\'noti\',[' + notiTasks.map(t=>'\''+t.id+'\'').join(',') + '])" class="text-[10px] text-purple-600 font-bold hover:underline">Đọc tất cả</button>'
                    + '</div>';
                html += notiTasks.map(t => {
                    const assignee = getUserName(t.user_id);
                    const dueDisplay = t.due_date ? formatDate(t.due_date) : '';
                    return '<div class="p-4 hover:bg-purple-50/50 transition border-b last:border-0">'
                        + '<div class="flex items-start gap-2">'
                        + '<div class="w-2 h-2 rounded-full bg-purple-400 mt-2 flex-shrink-0"></div>'
                        + '<div class="flex-1 min-w-0 cursor-pointer" onclick="closeDeadlinePanel();openTaskForm(' + JSON.stringify(t).replace(/"/g,'&quot;') + ')">'
                        + '<div class="font-bold text-slate-800 text-sm">Có công việc sắp đến hạn của ' + assignee + '</div>'
                        + '<div class="text-xs text-slate-500 mt-0.5 truncate">' + t.task_name + ' – ' + t.project_code + '</div>'
                        + '<div class="text-[10px] text-purple-500 font-bold mt-0.5">Hạn: ' + dueDisplay + '</div>'
                        + '</div>'
                        + readBtn('noti', t.id)
                        + '</div></div>';
                }).join('');
            }

            body.innerHTML = html;

            const permBtn = document.getElementById('notif-perm-btn');
            if ('Notification' in window && Notification.permission === 'default') {
                permBtn.classList.remove('hidden');
            } else {
                permBtn.classList.add('hidden');
            }

            document.getElementById('deadline-panel').classList.remove('hidden');
        }

        function markNotiRead(type, id) {
            markRead(type, String(id));
            updateBellBadge();
            showDeadlinePanel(); // re-render panel
        }

        function markAllNotiRead(type, ids) {
            markAllRead(type, ids);
            updateBellBadge();
            showDeadlinePanel();
        }

        function closeDeadlinePanel() {
            document.getElementById('deadline-panel').classList.add('hidden');
        }

        async function requestNotifPermission() {
            if (!('Notification' in window)) { alert('Tr&#236;nh duy&#7879;t kh&#244;ng h&#7895; tr&#7907; th&#244;ng b&#225;o.'); return; }
            const perm = await Notification.requestPermission();
            document.getElementById('notif-perm-btn').classList.add('hidden');
            if (perm === 'granted') sendBrowserNotifications();
        }

        function sendBrowserNotifications() {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            const tasks = getTodayDeadlineTasks();
            if (tasks.length === 0) return;
            const lines = tasks.slice(0, 5).map(t => '• ' + t.task_name + ' (' + t.project_code + ')').join('\n')
                + (tasks.length > 5 ? ('\n...và ' + (tasks.length - 5) + ' công việc khác') : '');
            try {
                new Notification('🔔 Task System – Deadline Hôm Nay', {
                    body: 'Bạn có ' + tasks.length + ' công việc đến hạn hôm nay chưa hoàn thành:\n' + lines,
                    tag: 'deadline-today',
                    requireInteraction: false
                });
            } catch(e) { console.warn('Notification error:', e); }
        }

        function showToastNotification(tasks) {
            if (tasks.length === 0) return;
            const msg = tasks.length === 1
                ? '"' + tasks[0].task_name + '" đến hạn hôm nay.'
                : tasks.length + ' công việc đến hạn hôm nay chưa hoàn thành.';
            document.getElementById('toast-msg').textContent = msg;
            const toast = document.getElementById('deadline-toast');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 8000);
        }

        function closeToast() {
            document.getElementById('deadline-toast').classList.add('hidden');
        }

        function checkAndNotifyDeadline() {
            const tasks = getTodayDeadlineTasks();
            updateBellBadge();
            if (tasks.length === 0) return;
            const todayKey = 'deadline_notified_' + new Date().toISOString().slice(0,10) + '_' + (SESSION.user ? SESSION.user.user_id : '');
            if (!localStorage.getItem(todayKey)) {
                localStorage.setItem(todayKey, '1');
                // Clean old keys
                Object.keys(localStorage).filter(k => k.startsWith('deadline_notified_')).sort().slice(0, -7).forEach(k => localStorage.removeItem(k));
                showToastNotification(tasks);
                sendBrowserNotifications();
            }
        }


        // Gắn tất cả function vào window để inline onclick trong innerHTML luôn tìm thấy
        window.applyTaskFilter = applyTaskFilter;
        window.applyCalFilter = applyCalFilter;
        window.toggleAdvance = toggleAdvance;
        window.openTaskForm = openTaskForm;
        window.doQuickSearch = doQuickSearch;
        window.applyDashboardFilter = applyDashboardFilter;
        window.changeMonth = changeMonth;
        window.renderCalendar = renderCalendar;
        window.doQuickStart = doQuickStart;
        window.doQuickDone = doQuickDone;
        window.doDeleteTask = doDeleteTask;
        window.closeModal = closeModal;
        window.handleLogin = handleLogin;
        window.logout = logout;
        window.showDeadlinePanel = showDeadlinePanel;
        window.closeDeadlinePanel = closeDeadlinePanel;
        window.closeToast = closeToast;
        window.closeConfirm = closeConfirm;
        window.markNotiRead = markNotiRead;
        window.markAllNotiRead = markAllNotiRead;
        window.requestNotifPermission = requestNotifPermission;
        </script>

    <!-- Deadline Notification Panel -->
    <div id="deadline-panel" class="modal-bg fixed inset-0 hidden flex items-start justify-end p-4 pt-16" onclick="if(event.target===this)closeDeadlinePanel()">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm border overflow-hidden" onclick="event.stopPropagation()">
            <div class="bg-gradient-to-r from-amber-500 to-orange-500 p-4 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">&#128276;</span>
                    <div>
                        <div class="font-black text-white text-sm">Deadline H&#244;m Nay</div>
                        <div id="notif-panel-date" class="text-amber-100 text-[10px]"></div>
                    </div>
                </div>
                <button onclick="closeDeadlinePanel()" class="text-white hover:text-amber-200 text-xl font-bold">&#10005;</button>
            </div>
            <div id="notif-panel-body" class="max-h-96 overflow-y-auto divide-y"></div>
            <div class="p-3 bg-slate-50 border-t flex gap-2">
                <button onclick="requestNotifPermission()" id="notif-perm-btn" class="flex-1 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hidden">&#128276; B&#7853;t th&#244;ng b&#225;o tr&#236;nh duy&#7879;t</button>
                <button onclick="closeDeadlinePanel()" class="flex-1 py-2 bg-slate-200 rounded-xl text-xs font-bold">&#272;&#243;ng</button>
            </div>
        </div>
    </div>

    <!-- In-app toast notification -->
    <div id="deadline-toast" class="fixed bottom-6 right-6 hidden z-50 max-w-sm w-full">
        <div class="bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl shadow-2xl p-4 flex items-start gap-3">
            <span class="text-2xl flex-shrink-0">&#128276;</span>
            <div class="flex-1 min-w-0">
                <div class="font-black text-sm mb-1">Nh&#7855;c nh&#7903; deadline h&#244;m nay!</div>
                <div id="toast-msg" class="text-xs text-amber-100"></div>
            </div>
            <button onclick="closeToast()" class="text-amber-200 hover:text-white flex-shrink-0">&#10005;</button>
        </div>
    </div>

</body>
</html>
