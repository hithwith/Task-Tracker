<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Công việc</title>
    <script>
        // Tắt warning của Tailwind CDN (chỉ ảnh hưởng warning này)
        const _warn = console.warn.bind(console);
        console.warn = (...args) => { if (args[0] && String(args[0]).includes('cdn.tailwindcss.com')) return; _warn(...args); };
    </script>
    <script>tailwind = { config: {} }</script>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>tailwind.config = { corePlugins: { preflight: true } }</script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .hidden { display: none; }
        .modal-bg { background-color: rgba(0,0,0,0.6); z-index: 100; }
        #confirm-modal { z-index: 200; }
        .active-menu { background-color: #2563eb !important; border-left: 4px solid #fff; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .multi-select-box { max-height: 150px; overflow-y: auto; border: 1px solid #ddd; padding: 5px; border-radius: 5px; }

        /* ===== DATE PICKER ===== */
        .dp-wrapper { position: relative; display: flex; align-items: center; }
        .dp-wrapper input { flex: 1; }
        .dp-icon-btn {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; padding: 2px 4px;
            font-size: 16px; line-height: 1; color: #64748b; z-index: 2;
            transition: color 0.15s;
        }
        .dp-icon-btn:hover { color: #2563eb; }
        .dp-wrapper input { padding-right: 2rem !important; }

        .dp-popup {
            position: absolute; top: calc(100% + 4px); left: 0;
            background: #fff; border: 1.5px solid #e2e8f0; border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.13); z-index: 9999;
            min-width: 280px; padding: 14px; user-select: none;
            animation: dpFadeIn 0.12s ease;
        }
        .dp-popup.dp-align-right { left: auto; right: 0; }
        @keyframes dpFadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

        .dp-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 10px;
        }
        .dp-nav-btn {
            width: 30px; height: 30px; border: none; background: #f1f5f9;
            border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 900;
            color: #334155; display: flex; align-items: center; justify-content: center;
            transition: background 0.12s;
        }
        .dp-nav-btn:hover { background: #2563eb; color: #fff; }
        .dp-month-year {
            font-size: 13px; font-weight: 900; color: #1e293b;
            cursor: pointer; padding: 4px 10px; border-radius: 8px;
            transition: background 0.12s;
        }
        .dp-month-year:hover { background: #f1f5f9; }

        .dp-weekdays {
            display: grid; grid-template-columns: repeat(7, 1fr);
            margin-bottom: 4px;
        }
        .dp-wd {
            text-align: center; font-size: 9px; font-weight: 900;
            color: #94a3b8; padding: 3px 0; text-transform: uppercase;
        }
        .dp-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .dp-day {
            text-align: center; font-size: 12px; font-weight: 600; padding: 6px 2px;
            border-radius: 8px; cursor: pointer; color: #334155; transition: background 0.1s, color 0.1s;
        }
        .dp-day:hover:not(.dp-empty):not(.dp-selected) { background: #eff6ff; color: #2563eb; }
        .dp-day.dp-today { color: #2563eb; font-weight: 900; }
        .dp-day.dp-selected { background: #2563eb; color: #fff !important; border-radius: 8px; }
        .dp-day.dp-empty { cursor: default; }
        .dp-day.dp-other-month { color: #cbd5e1; }

        .dp-footer { margin-top: 10px; border-top: 1px solid #f1f5f9; padding-top: 8px; display: flex; justify-content: space-between; align-items: center; }
        .dp-today-btn {
            font-size: 11px; font-weight: 700; color: #2563eb; background: #eff6ff;
            border: none; border-radius: 7px; padding: 4px 10px; cursor: pointer;
        }
        .dp-today-btn:hover { background: #dbeafe; }
        .dp-clear-btn {
            font-size: 11px; font-weight: 700; color: #ef4444; background: #fef2f2;
            border: none; border-radius: 7px; padding: 4px 10px; cursor: pointer;
        }
        .dp-clear-btn:hover { background: #fee2e2; }

        /* Month/Year picker view */
        .dp-my-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px;
        }
        .dp-my-item {
            text-align: center; font-size: 12px; font-weight: 700; padding: 7px 4px;
            border-radius: 8px; cursor: pointer; color: #334155;
            transition: background 0.1s, color 0.1s;
        }
        .dp-my-item:hover { background: #eff6ff; color: #2563eb; }
        .dp-my-item.dp-my-selected { background: #2563eb; color: #fff; }
        /* Toggle switch peer styles */
        input[type="checkbox"].sr-only:checked ~ div.peer-checked\:bg-blue-600 { background-color: #2563eb; }
        input[type="checkbox"].sr-only:checked ~ div + div.peer-checked\:translate-x-5 { transform: translateX(1.25rem); }
        /* Peer selector workaround for Tailwind CDN */
        .toggle-track { width:2.75rem; height:1.5rem; background:#e2e8f0; border-radius:9999px; position:relative; transition:background .2s; }
        .toggle-thumb { position:absolute; top:2px; left:2px; width:1.25rem; height:1.25rem; background:#fff; border-radius:9999px; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform .2s; }
        input[type="checkbox"].toggle-cb:checked + .toggle-track { background:#2563eb; }
        input[type="checkbox"].toggle-cb:checked + .toggle-track .toggle-thumb { transform:translateX(1.25rem); }

        /* ===== BIRTHDAY MODAL ===== */
        #birthday-modal {
            z-index: 9999;
            animation: bdFadeIn 0.4s ease;
        }
        @keyframes bdFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .birthday-card {
            animation: bdSlideUp 0.45s cubic-bezier(.22,1,.36,1);
        }
        @keyframes bdSlideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: none; }
        }
        .confetti-emoji {
            position: absolute;
            font-size: 1.5rem;
            animation: confettiFall linear infinite;
            pointer-events: none;
        }
        @keyframes confettiFall {
            0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(340px) rotate(360deg); opacity: 0; }
        }
        .bd-name-tag {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .bd-avatar {
            width: 72px; height: 72px; border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; font-weight: 900; color: #fff;
            border: 4px solid #fbbf24;
            box-shadow: 0 0 0 4px rgba(251,191,36,0.25);
            flex-shrink: 0;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <script>
        // Link API của bạn
        const API_URL = 'https://script.google.com/macros/s/AKfycbwrXGZLfaEyxrLYPasVx6g1djpqrSpmrfaKPEwOsSER461N0QyGRcNZhRYM3W1zBhrrLA/exec';
    </script>

    <div id="login-screen" class="hidden min-h-screen flex items-center justify-center bg-slate-900">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-blue-600">
            <h2 class="text-3xl font-black mb-8 text-center text-slate-800 tracking-tight">TASK SYSTEM</h2>
            <div class="space-y-4">
                <input type="hidden" id="unit_name" value="ARITO">
                <input type="text" id="username" class="w-full p-3 border-2 rounded-xl focus:border-blue-500 outline-none transition" placeholder="Tên đăng nhập">
                <input type="password" id="password" class="w-full p-3 border-2 rounded-xl focus:border-blue-500 outline-none transition" placeholder="Mật khẩu">
                <button onclick="handleLogin()" id="login-btn" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold hover:bg-blue-700 shadow-lg transform active:scale-95 transition">ĐĂNG NHẬP</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden flex h-screen overflow-hidden">
        <div class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl">
            <div class="p-6 text-2xl font-black text-blue-400 border-b border-slate-800">TASK TRACKER</div>
            <nav id="sidebar-menu" class="flex-1 mt-4 px-3 space-y-2"></nav>
            <div class="p-4 bg-slate-800 border-t border-slate-700">
                <div id="user-display" class="font-bold text-blue-300"></div>
                <button onclick="logout()" class="text-red-400 hover:text-red-300 text-xs font-bold mt-2 uppercase tracking-widest">Đăng xuất</button>
            </div>
        </div>

        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow-sm p-5 border-b flex justify-between items-center">
                <h2 id="page-title" class="text-xl font-extrabold text-slate-700 uppercase tracking-tight"></h2>
                <div class="flex items-center gap-3">
                    <button id="birthday-bell-btn" onclick="openBirthdayFromHeader()" class="hidden relative w-10 h-10 rounded-xl bg-slate-50 hover:bg-pink-50 border border-slate-200 flex items-center justify-center transition" title="Sinh nhật hôm nay">
                        <span class="text-xl">🎂</span>
                        <span id="birthday-badge" class="absolute -top-1 -right-1 bg-pink-500 text-white text-[10px] font-black rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1">0</span>
                    </button>
                    <button id="notif-bell-btn" onclick="showDeadlinePanel()" class="relative w-10 h-10 rounded-xl bg-slate-50 hover:bg-amber-50 border border-slate-200 flex items-center justify-center transition" title="Thông báo deadline hôm nay">
                        <span class="text-xl">🔔</span>
                        <span id="notif-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-black rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1">0</span>
                    </button>
                </div>
            </header>
            <main class="flex-1 overflow-auto p-6 scrollbar-hide" id="main-content"></main>
        </div>
    </div>

    <div id="confirm-modal" class="modal-bg fixed inset-0 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
            <div class="w-16 h-16 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">!</div>
            <h3 id="confirm-title" class="text-xl font-bold mb-2">Xác nhận</h3>
            <p id="confirm-msg" class="text-gray-500 mb-6 text-sm"></p>
            <div class="flex space-x-3">
                <button onclick="closeConfirm(false)" class="flex-1 py-3 bg-gray-100 rounded-xl font-bold">Hủy</button>
                <button id="confirm-ok-btn" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg">Đồng ý</button>
            </div>
        </div>
    </div>

    <!-- Deadline Notification Panel -->
    <div id="deadline-panel" class="modal-bg fixed inset-0 hidden flex items-start justify-end p-4 pt-16" onclick="if(event.target===this)closeDeadlinePanel()">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm border overflow-hidden" onclick="event.stopPropagation()">
            <div class="bg-gradient-to-r from-amber-500 to-orange-500 p-4 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🔔</span>
                    <div>
                        <div class="font-black text-white text-sm">Deadline Hôm Nay</div>
                        <div id="notif-panel-date" class="text-amber-100 text-[10px]"></div>
                    </div>
                </div>
                <button onclick="closeDeadlinePanel()" class="text-white hover:text-amber-200 text-xl font-bold">✕</button>
            </div>
            <div id="notif-panel-body" class="max-h-96 overflow-y-auto divide-y"></div>
            <div class="p-3 bg-slate-50 border-t flex gap-2">
                <button onclick="requestNotifPermission()" id="notif-perm-btn" class="flex-1 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hidden">🔔 Bật thông báo trình duyệt</button>
                <button onclick="closeDeadlinePanel()" class="flex-1 py-2 bg-slate-200 rounded-xl text-xs font-bold">Đóng</button>
            </div>
        </div>
    </div>

    <!-- In-app toast notification -->
    <div id="deadline-toast" class="fixed bottom-6 right-6 hidden z-50 max-w-sm w-full">
        <div class="bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl shadow-2xl p-4 flex items-start gap-3">
            <span class="text-2xl flex-shrink-0">🔔</span>
            <div class="flex-1 min-w-0">
                <div class="font-black text-sm mb-1">Nhắc nhở deadline hôm nay!</div>
                <div id="toast-msg" class="text-xs text-amber-100"></div>
            </div>
            <button onclick="closeToast()" class="text-amber-200 hover:text-white flex-shrink-0">✕</button>
        </div>
    </div>

    <div id="modal-area"></div>

    <script>
        let SESSION = null;
        let ALL_TASKS = [];
        let MASTER_DATA = { projects: [], priorities: [], statuses: [], users: [] };
        let currentCalDate = new Date();
        let confirmCallback = null;
        let TASKS_DIRTY = true;
        let currentMenuId = null;
        // Lưu trạng thái bộ lọc đang áp dụng ở màn hình 10.01
        let ACTIVE_FILTER_1001 = null; // null = chưa lọc, object = đang lọc

        function showConfirm(title, msg, callback) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-msg').innerText = msg;
            document.getElementById('confirm-modal').classList.remove('hidden');
            confirmCallback = callback;
            document.getElementById('confirm-ok-btn').onclick = () => { closeConfirm(true); };
        }
        function closeConfirm(isOk) {
            document.getElementById('confirm-modal').classList.add('hidden');
            if (isOk && confirmCallback) confirmCallback();
        }

        async function handleLogin() {
            const btn = document.getElementById('login-btn');
            btn.innerText = 'ĐANG ĐĂNG NHẬP...'; btn.disabled = true;
            const data = { action: 'login', data: {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                unit_name: document.getElementById('unit_name').value
            }};
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });
                const result = await res.json();
                if (result.status === 'success') {
                    SESSION = result;
                    localStorage.setItem('arito_qlcv_session', JSON.stringify(result));
                    initApp();
                } else {
                    alert("Sai thông tin đăng nhập!");
                    btn.innerText = 'ĐĂNG NHẬP'; btn.disabled = false;
                }
            } catch (e) {
                alert("Lỗi kết nối API. Vui lòng kiểm tra lại Link App Script.");
                btn.innerText = 'ĐĂNG NHẬP'; btn.disabled = false;
            }
        }

        async function initApp() {
            console.log('initApp - SESSION.menus:', JSON.stringify(SESSION.menus));
            console.log('initApp - sidebarEl sau render:', document.getElementById('sidebar-menu')?.innerHTML?.substring(0, 500));
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-display').innerText = SESSION.user.fullname;

            const isAdmin = SESSION.user.admin == 1 || SESSION.user.admin === true || SESSION.user.admin === '1';

            // Build sidebar menu bằng DOM API - tránh lỗi encoding/template literal
            const sidebarEl = document.getElementById('sidebar-menu');
            sidebarEl.innerHTML = '';

            // 1. Menu từ API (lọc bỏ các menu cố định)
            const excludedIds = ['10.05', '10.05.01', '10.05.02', '10.06'];
            (SESSION.menus || [])
                .filter(m => !excludedIds.includes(m.menu_id))
                .filter(m => m.menu_id !== '10.04' || isAdmin)
                .forEach(m => {
                    const a = document.createElement('a');
                    a.href = 'javascript:void(0)';
                    a.id = 'menu-' + m.menu_id;
                    a.className = 'sidebar-item flex items-center p-4 rounded-xl text-sm font-bold transition';
                    a.textContent = m.text;
                    a.onclick = () => switchMenu(m.menu_id, m.text);
                    sidebarEl.appendChild(a);
                });

            // 2. Menu 10.06 - Vắng mặt / Ra ngoài (cố định, luôn hiện)
            const a1006 = document.createElement('a');
            a1006.href = 'javascript:void(0)';
            a1006.id = 'menu-10.06';
            a1006.className = 'sidebar-item flex items-center p-4 rounded-xl text-sm font-bold transition';
            a1006.textContent = '🚪 Vắng mặt / Ra ngoài';
            a1006.onclick = () => switchMenu('10.06', 'Vắng mặt / Ra ngoài');
            sidebarEl.appendChild(a1006);

            // 3. Nhóm Báo cáo
            const reportGroup = document.createElement('div');
            reportGroup.className = 'mt-3 pt-3 border-t border-slate-700';
            reportGroup.innerHTML = '<div class="px-4 pb-1 text-[10px] font-black text-slate-500 uppercase tracking-widest">📊 Báo cáo</div>';

            const a1 = document.createElement('a');
            a1.href = 'javascript:void(0)';
            a1.id = 'menu-10.05.01';
            a1.className = 'sidebar-item flex items-center pl-6 pr-4 py-3 rounded-xl text-xs font-bold transition';
            a1.textContent = '📅 Thống kê thời gian cá nhân';
            a1.onclick = () => switchMenu('10.05.01', 'Thống kê thời gian làm việc cá nhân');
            reportGroup.appendChild(a1);

            const a2 = document.createElement('a');
            a2.href = 'javascript:void(0)';
            a2.id = 'menu-10.05.02';
            a2.className = 'sidebar-item flex items-center pl-6 pr-4 py-3 rounded-xl text-xs font-bold transition';
            a2.textContent = '📈 Thống kê thời gian làm việc phòng';
            a2.onclick = () => switchMenu('10.05.02', 'Báo cáo tổng tình hình làm việc phòng');
            reportGroup.appendChild(a2);
            sidebarEl.appendChild(reportGroup);
            console.log('sidebar HTML sau khi build:', sidebarEl.innerHTML.substring(0, 800));
            document.getElementById('page-title').innerText = 'Tổng hợp công việc';
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active-menu'));
            document.getElementById('menu-10.01')?.classList.add('active-menu');
            currentMenuId = '10.01';

            // Load cache ngay lập tức
            const cacheKeyMD = 'arito_master_data_' + SESSION.unit.unit_id;
            const cacheKeyTasks = 'arito_tasks_' + SESSION.unit.unit_id;
            let hasCachedTasks = false;
            try {
                const cachedMD = localStorage.getItem(cacheKeyMD);
                if (cachedMD) MASTER_DATA = JSON.parse(cachedMD);
                const cachedTasks = localStorage.getItem(cacheKeyTasks);
                if (cachedTasks) {
                    ALL_TASKS = JSON.parse(cachedTasks);
                    hasCachedTasks = true;
                }
            } catch(e) {}

            // Nếu có cache tasks -> render ngay, không cần chờ API
            if (hasCachedTasks) {
                TASKS_DIRTY = false;
                renderTable1001();
                checkAndNotifyDeadline();
                // KHÔNG gọi checkAndNotifyBirthday() ở đây vì MASTER_DATA từ cache
                // có thể chưa có users đầy đủ. Để getInitialData xong mới gọi.
            } else {
                // Chưa có cache -> hiện skeleton
                document.getElementById('main-content').innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border mb-6 animate-pulse">
                        <div class="flex gap-4"><div class="flex-1 h-10 bg-slate-100 rounded-xl"></div><div class="w-32 h-10 bg-slate-100 rounded-xl"></div><div class="w-32 h-10 bg-blue-100 rounded-xl"></div></div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        ${[1,2,3,4,5].map(() => `<div class="flex gap-4 p-5 border-b animate-pulse">
                            <div class="w-20 h-4 bg-slate-100 rounded"></div>
                            <div class="flex-1 space-y-2"><div class="h-4 bg-slate-100 rounded w-3/4"></div><div class="h-3 bg-slate-50 rounded w-1/3"></div></div>
                            <div class="w-20 h-4 bg-slate-100 rounded"></div>
                            <div class="w-24 h-4 bg-slate-100 rounded"></div>
                            <div class="w-16 h-6 bg-slate-100 rounded-full"></div>
                            <div class="w-20 h-6 bg-blue-50 rounded"></div>
                        </div>`).join('')}
                    </div>`;
            }

            // Fetch 2 API độc lập, cái nào xong trước thì cập nhật trước
            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getInitialData' }) })
                .then(r => r.json())
                .then(md => {
                    MASTER_DATA = md;
                    try { localStorage.setItem(cacheKeyMD, JSON.stringify(md)); } catch(e) {}
                    checkAndNotifyBirthday();
                })
                .catch(e => console.error('Lỗi getInitialData:', e));

            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getTasks', data: { unit_id: SESSION.unit.unit_id } }) })
                .then(r => r.json())
                .then(taskResult => {
                    ALL_TASKS = taskResult.data || [];
                    TASKS_DIRTY = false;
                    try { localStorage.setItem(cacheKeyTasks, JSON.stringify(ALL_TASKS)); } catch(e) {}
                    // Re-render chỉ nếu đang ở trang 10.01
                    if (currentMenuId === '10.01') renderTable1001();
                    checkAndNotifyDeadline();
                })
                .catch(e => console.error('Lỗi getTasks:', e));
        }

        async function switchMenu(menuId, text) {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active-menu'));
            document.getElementById(`menu-${menuId}`)?.classList.add('active-menu');
            document.getElementById('page-title').innerText = text;
            currentMenuId = menuId;

            if (TASKS_DIRTY) {
                const main = document.getElementById('main-content');
                main.innerHTML = '<div class="flex justify-center mt-20"><div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div></div>';
                try {
                    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getTasks', data: { unit_id: SESSION.unit.unit_id } })});
                    const result = await res.json();
                    ALL_TASKS = result.data || [];
                    TASKS_DIRTY = false;
                    checkAndNotifyDeadline();
                } catch(e) { console.error('Lỗi tải dữ liệu:', e); }
            }

            if (menuId === '10.01') renderTable1001();
            else if (menuId === '10.02') renderCalendar();
            else if (menuId === '10.03') renderDashboard();
            else if (menuId === '10.04') renderProjectList();
            else if (menuId === '10.05.01') renderReport100501();
            else if (menuId === '10.05.02') renderReport100502();
            else if (menuId === '10.06') await renderOutoffice();
        }

        function applyColFilter() {
            const project  = document.getElementById('cf_project')?.value  || '';
            const name     = (document.getElementById('cf_name')?.value     || '').toLowerCase().trim();
            const status   = document.getElementById('cf_status')?.value    || '';

            const hasFilter = project || name || status;

            const base = ACTIVE_FILTER_1001
                ? _applyFilter1001(ACTIVE_FILTER_1001)
                : ALL_TASKS.filter(t => t.user_id == SESSION.user.user_id && (t.status == 0 || t.status == 3));

            const result = hasFilter ? base.filter(t => {
                if (project && t.project_code !== project) return false;
                if (name && !(t.task_name || '').toLowerCase().includes(name)) return false;
                if (status && String(t.status) !== String(status)) return false;
                return true;
            }) : base;

            const tbody = document.getElementById('task-table-body');
            if (!tbody) return;
            tbody.innerHTML = result.length > 0
                ? renderTaskRows(result)
                : '<tr><td colspan="7" class="p-8 text-center text-slate-400 text-sm font-bold">Không tìm thấy công việc nào phù hợp</td></tr>';

            ['cf_project','cf_name','cf_status'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                if (el.value) { el.style.borderColor = '#2563eb'; el.style.background = '#eff6ff'; }
                else          { el.style.borderColor = ''; el.style.background = ''; }
            });
        }

        function clearColFilter() {
            ['cf_project','cf_name','cf_status'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                el.value = '';
                el.style.borderColor = '';
                el.style.background = '';
            });
            applyColFilter();
        }

        window.applyColFilter = applyColFilter;
        window.clearColFilter = clearColFilter;

        function renderTaskRows(tasks) {
            const todayMid = new Date(); todayMid.setHours(0,0,0,0);
            return tasks.map(t => {
                const isOverdue = t.status != 5 && t.due_date && (() => { const d = parseLocalDate(t.due_date); return d && d < todayMid; })();
                const rowCls = isOverdue
                    ? 'bg-rose-50 hover:bg-rose-100 cursor-pointer transition border-l-4 border-rose-400'
                    : 'hover:bg-blue-50/50 cursor-pointer transition';
                const nameCls   = isOverdue ? 'font-bold text-rose-700' : 'font-bold text-slate-800';
                const subCls    = isOverdue ? 'text-xs text-rose-400 font-medium' : 'text-xs text-slate-400 font-medium';
                const projCls   = isOverdue ? 'p-5 font-bold text-rose-500 text-sm' : 'p-5 font-bold text-blue-600 text-sm';
                const startCls  = isOverdue ? 'p-5 text-center text-xs text-rose-400' : 'p-5 text-center text-xs text-slate-500';
                const dueCls    = isOverdue ? 'p-5 text-center text-xs font-black text-rose-600' : 'p-5 text-center text-xs font-black text-orange-600';
                return `
                <tr class="${rowCls}" onclick="openTaskForm(${JSON.stringify(t).replace(/"/g, '&quot;')})">
                    <td class="${projCls}">${isOverdue ? '🔴 ' : ''}${t.project_code}</td>
                    <td class="p-5">
                        <div class="${nameCls}">${t.task_name}</div>
                        <div class="${subCls}">${getUserName(t.user_id)}</div>
                    </td>
                    <td class="${startCls}">${formatDate(t.start_date)}</td>
                    <td class="${dueCls}">${formatDate(t.due_date)}</td>
                    <td class="p-5 text-center text-xs font-black text-emerald-600">${t.finish_date ? formatFinishDate(t.finish_date) : '<span class="text-slate-300">—</span>'}</td>
                    <td class="p-5 text-center">
                        <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${getStatusColor(t.status)}">${getStatusName(t.status)}</span>
                    </td>
                    <td class="p-5 text-right space-x-1" onclick="event.stopPropagation()">
                        ${t.status == 0 ? `<button onclick="doQuickStart('${t.id}')" class="bg-blue-500 text-white px-3 py-1 rounded-lg text-[10px] font-black shadow-lg">BẮT ĐẦU</button>` : ''}
                        ${t.status == 3 ? `<button onclick="doQuickDone('${t.id}')" class="bg-emerald-500 text-white px-3 py-1 rounded-lg text-[10px] font-black shadow-lg">XONG</button>` : (t.status == 5 ? '✅' : '')}
                    </td>
                </tr>`;
            }).join('');
        }

        function applyTaskFilter() {
            try {
                const stList = Array.from(document.querySelectorAll('#adv_st_list input:checked')).map(i => i.value);
                const cStart = document.getElementById('adv_c_start').value;
                const cEnd = document.getElementById('adv_c_end').value;
                const dStart = document.getElementById('adv_d_start').value;
                const dEnd = document.getElementById('adv_d_end').value;
                const projectCode = document.getElementById('adv_project').value;
                const userId = document.getElementById('adv_user').value;

                // Lưu lại trạng thái bộ lọc để giữ sau khi sửa/lưu task
                ACTIVE_FILTER_1001 = { stList, cStart, cEnd, dStart, dEnd, projectCode, userId };

                const filtered = _applyFilter1001(ACTIVE_FILTER_1001);

                const tbody = document.getElementById('task-table-body');
                if (!tbody) { console.error('task-table-body not found'); return; }
                tbody.innerHTML = filtered.length > 0
                    ? renderTaskRows(filtered)
                    : '<tr><td colspan="7" class="p-8 text-center text-slate-400 text-sm font-bold">Không tìm thấy công việc nào phù hợp với bộ lọc</td></tr>';

                // Đóng panel và scroll xuống bảng
                const panel = document.getElementById('adv-filter-task');
                if (panel) panel.style.display = 'none';
                tbody.closest('table')?.scrollIntoView({ behavior: 'smooth', block: 'start' });

                // Hiện thông báo số kết quả
                const btn = document.querySelector('[onclick="applyTaskFilter()"]');
                if (btn) {
                    const orig = btn.textContent;
                    btn.textContent = 'Tìm thấy ' + filtered.length + ' việc';
                    btn.classList.add('bg-green-700');
                    btn.classList.remove('bg-slate-800');
                    setTimeout(() => {
                        btn.textContent = orig;
                        btn.classList.remove('bg-green-700');
                        btn.classList.add('bg-slate-800');
                    }, 2500);
                }
            } catch(err) {
                console.error('applyTaskFilter error:', err);
                alert('Lỗi bộ lọc: ' + err.message);
            }
        }

        // Hàm lọc thuần tuý (tách riêng để dùng lại)
        function _applyFilter1001(f) {
            return ALL_TASKS.filter(t => {
                const matchStatus = f.stList.length === 0 || f.stList.includes(String(t.status));
                const matchProject = !f.projectCode || t.project_code === f.projectCode;
                const matchUser = !f.userId || String(t.user_id) === String(f.userId);

                let matchC = true;
                if (t.datetime0 && (f.cStart || f.cEnd)) {
                    const dateC = parseLocalDate(t.datetime0);
                    if (dateC) {
                        if (f.cStart) { const ds = parseLocalDate(f.cStart); if (ds && dateC < ds) matchC = false; }
                        if (f.cEnd)   { const de = parseLocalDate(f.cEnd);   if (de && dateC > de) matchC = false; }
                    }
                }

                let matchD = true;
                if (t.due_date && (f.dStart || f.dEnd)) {
                    const dateD = parseLocalDate(t.due_date);
                    if (dateD) {
                        if (f.dStart) { const ds = parseLocalDate(f.dStart); if (ds && dateD < ds) matchD = false; }
                        if (f.dEnd)   { const de = parseLocalDate(f.dEnd);   if (de && dateD > de) matchD = false; }
                    }
                }
                return matchStatus && matchProject && matchUser && matchC && matchD;
            });
        }

        // Refresh chỉ tbody, giữ nguyên bộ lọc đang áp dụng
        function refreshTable1001() {
            const tbody = document.getElementById('task-table-body');
            if (!tbody) {
                // Trang chưa render, render lại toàn bộ
                renderTable1001();
                return;
            }
            if (ACTIVE_FILTER_1001) {
                // Đang có bộ lọc -> tái áp dụng
                const filtered = _applyFilter1001(ACTIVE_FILTER_1001);
                tbody.innerHTML = filtered.length > 0
                    ? renderTaskRows(filtered)
                    : '<tr><td colspan="7" class="p-8 text-center text-slate-400 text-sm font-bold">Không tìm thấy công việc nào phù hợp với bộ lọc</td></tr>';
            } else {
                // Không có bộ lọc -> hiện mặc định
                const defaultFiltered = ALL_TASKS.filter(t => t.user_id == SESSION.user.user_id && (t.status == 0 || t.status == 3));
                tbody.innerHTML = renderTaskRows(defaultFiltered);
            }
        }

        // --- 10.02 LỊCH ---
        function renderCalendar(dataToRender = null) {
            const container = document.getElementById('main-content');
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();

            const tasksToDisplay = dataToRender || ALL_TASKS.filter(t => (t.status == 0 || t.status == 3) && String(t.user_id) === String(SESSION.user.user_id));

            container.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border mb-6">
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex gap-2">
                            <button onclick="changeMonth(-1)" class="w-10 h-10 bg-gray-50 rounded-xl border flex items-center justify-center font-bold">◀</button>
                            <h3 id="cal-month-title" class="text-2xl font-black text-slate-800 px-4 flex items-center">THÁNG ${(month+1)} / ${year}</h3>
                            <button onclick="changeMonth(1)" class="w-10 h-10 bg-gray-50 rounded-xl border flex items-center justify-center font-bold">▶</button>
                        </div>
                        <button onclick="toggleAdvance('cal')" class="px-5 py-2.5 bg-slate-100 rounded-xl font-bold text-sm">Bộ lọc lịch</button>
                    </div>
                    
                    <div id="adv-filter-cal" class="mb-8 p-6 bg-slate-50 rounded-2xl border" style="display:none; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem;">
                        <div><label class="text-xs font-bold uppercase">Hạn từ - Đến</label><div class="flex gap-2"><input type="text" id="cal_d_start" class="date-mask w-full p-2 border rounded-lg text-xs" placeholder="DD/MM/YYYY" maxlength="10"><input type="text" id="cal_d_end" class="date-mask w-full p-2 border rounded-lg text-xs" placeholder="DD/MM/YYYY" maxlength="10"></div></div>
                        <div><label class="text-xs font-bold uppercase">Người thực hiện</label><select id="cal_user" class="w-full p-2 border rounded-lg text-xs"><option value="">Tất cả</option>${MASTER_DATA.users.map(u => `<option value="${u.user_id}" ${String(u.user_id) === String(SESSION.user.user_id) ? 'selected' : ''}>${u.username}</option>`).join('')}</select></div>
                        <div><label class="text-xs font-bold uppercase">Trạng thái</label><div class="multi-select-box text-[10px]" id="cal_st_list">${MASTER_DATA.statuses.map(s => `<label class="block"><input type="checkbox" value="${s.status_code}" ${(s.status_code == 0 || s.status_code == 3) ? 'checked' : ''}> ${s.status_name}</label>`).join('')}</div></div>
                        <div class="flex items-end"><button onclick="applyCalFilter()" class="w-full py-2.5 bg-blue-600 text-white rounded-xl font-bold text-sm">LỌC LỊCH</button></div>
                    </div>

                    <div id="cal-grid-wrapper"></div>
                </div>`;
            initDateMasks();
            renderCalendarGrid(tasksToDisplay);
        }

        function renderCalendarGrid(tasksToDisplay) {
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Cập nhật tiêu đề tháng nếu đang có sẵn
            const titleEl = document.getElementById('cal-month-title');
            if (titleEl) titleEl.textContent = `THÁNG ${month+1} / ${year}`;

            const wrapper = document.getElementById('cal-grid-wrapper');
            if (!wrapper) return;

            wrapper.innerHTML = `
                <div class="grid grid-cols-7 gap-px bg-slate-200 border rounded-xl overflow-hidden shadow-inner">
                    ${['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'].map(d => `<div class="bg-slate-50 p-3 text-center font-black text-[10px] text-slate-400">${d}</div>`).join('')}
                    ${Array(firstDay).fill('').map(() => `<div class="bg-slate-50 p-2 min-h-[8rem]"></div>`).join('')}
                    ${Array.from({length: daysInMonth}, (_, i) => {
                        const d = i + 1;
                        const dStr = `${year}-${(month+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
                        const cellDate = new Date(year, month, d);
                        const todayMid = new Date(); todayMid.setHours(0,0,0,0);
                        const isOverdueCell = cellDate < todayMid;
                        const dayTasks = tasksToDisplay.filter(t => {
                            if (!t.due_date) return false;
                            const ld = parseLocalDate(t.due_date);
                            if (!ld) return false;
                            return ld.getFullYear() === year && ld.getMonth() === month && ld.getDate() === d;
                        });
                        return `<div class="bg-white p-2 min-h-[8rem] border-t hover:bg-blue-50/50 cursor-pointer">
                            <div class="text-xs font-black mb-1 ${(d == new Date().getDate() && month == new Date().getMonth() && year == new Date().getFullYear()) ? 'text-blue-600 bg-blue-50 w-6 h-6 flex items-center justify-center rounded-full' : ''}">${d}</div>
                            ${dayTasks.map(t => {
                                const isOverdue = isOverdueCell && t.status != 5;
                                const chipCls = isOverdue
                                    ? 'bg-rose-100 text-rose-700 border border-rose-300'
                                    : 'bg-blue-100 text-blue-700';
                                return `<div class="text-[8px] ${chipCls} p-1 mb-0.5 rounded-md font-bold break-words whitespace-normal" onclick="openTaskForm(${JSON.stringify(t).replace(/"/g,'&quot;')})">(${t.project_code}) ${t.task_name}<span class="opacity-60 font-normal"> – ${getUserName(t.user_id)}</span></div>`;
                            }).join('')}
                        </div>`;
                    }).join('')}
                </div>`;
        }

        function applyCalFilter() {
            try {
                const stList = Array.from(document.querySelectorAll('#cal_st_list input:checked')).map(i => i.value);
                const uId = document.getElementById('cal_user').value;
                const dStart = document.getElementById('cal_d_start').value;
                const dEnd = document.getElementById('cal_d_end').value;

                const filtered = ALL_TASKS.filter(t => {
                    const matchStatus = stList.length === 0 || stList.includes(String(t.status));
                    const matchUser = !uId || String(t.user_id) == String(uId);

                    let matchD = true;
                    if (t.due_date && (dStart || dEnd)) {
                        const dateD = parseLocalDate(t.due_date);
                        if (dateD) {
                            if (dStart) { const ds = parseLocalDate(dStart); if (ds && dateD < ds) matchD = false; }
                            if (dEnd)   { const de = parseLocalDate(dEnd);   if (de && dateD > de) matchD = false; }
                        }
                    }
                    return matchStatus && matchUser && matchD;
                });

                renderCalendarGrid(filtered);

                const panel = document.getElementById('adv-filter-cal');
                if (panel) panel.style.display = 'none';

                // Hiện thông báo số kết quả
                const btn = document.querySelector('[onclick="applyCalFilter()"]');
                if (btn) {
                    const orig = btn.textContent;
                    btn.textContent = 'Lọc ' + filtered.length + ' việc';
                    btn.style.backgroundColor = '#15803d';
                    setTimeout(() => {
                        btn.textContent = orig;
                        btn.style.backgroundColor = '';
                    }, 2500);
                }
            } catch(err) {
                console.error('applyCalFilter error:', err);
                alert('Lỗi bộ lọc lịch: ' + err.message);
            }
        }

        // --- 10.03 DASHBOARD ---
        function renderDashboard(filterProject = '', filterUser = null) {
            const container = document.getElementById('main-content');
            const now = new Date();
            now.setHours(0,0,0,0);
            const weekLater = new Date(now); weekLater.setDate(weekLater.getDate() + 7);

            // null = lần đầu vào -> mặc định user hiện tại; '' = chọn Tất cả -> không lọc
            const activeUser = (filterUser === null) ? String(SESSION.user.user_id) : filterUser;

            // Lọc tập dữ liệu theo filter
            const base = ALL_TASKS.filter(t => {
                const matchProject = !filterProject || t.project_code === filterProject;
                const matchUser = !activeUser || String(t.user_id) === activeUser;
                return matchProject && matchUser;

        // --- CÁC HÀM CÔNG VIỆC KHÁC ---
        function isValidDate(str) {
            // Kiểm tra DD/MM/YYYY hợp lệ đầy đủ
            if (!str) return false;
            const parts = str.split('/');
            if (parts.length !== 3) return false;
            const [d, m, y] = parts.map(Number);
            if (!d || !m || !y || y < 1000 || y > 9999) return false;
            if (m < 1 || m > 12) return false;
            if (d < 1 || d > 31) return false;
            const dt = new Date(y, m - 1, d);
            return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
        }

        function highlightInvalidDate(name, msg) {
            const el = document.querySelector('[name="' + name + '"]');
            if (el) {
                el.style.borderColor = '#ef4444';
                el.focus();
                el.title = msg;
                el.placeholder = msg;
                el.addEventListener('input', function fix() {
                    el.style.borderColor = '';
                    el.placeholder = 'DD/MM/YYYY';
                    el.title = '';
                    el.removeEventListener('input', fix);
                }, { once: true });
            }
        }

                                <div class="flex gap-3"><button type="button" onclick="closeModal('task-modal')" class="px-6 py-2 bg-gray-100 rounded-xl font-bold text-sm">HỦY</button><button type="submit" class="px-8 py-2 bg-blue-600 text-white rounded-xl font-black shadow-lg shadow-blue-200 text-sm">LƯU THÔNG TIN</button></div>
                            </div>
                        </form>
                    </div>
                </div>`;
            document.getElementById('modal-area').innerHTML = html;
            initDateMasks();
            updateNotiDisplay();
            document.getElementById('form-task').onsubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                // --- Validate ngày trước khi lưu ---
                const startVal = data['start_date'];
                const dueVal   = data['due_date'];

                if (startVal && !isValidDate(startVal)) {
                    highlightInvalidDate('start_date', 'Ngày không hợp lệ! Nhập đủ DD/MM/YYYY');
                    return;
                }
                if (!dueVal || !isValidDate(dueVal)) {
                    highlightInvalidDate('due_date', 'Vui lòng nhập đủ ngày/tháng/năm');
                    return;
                }

                // Convert DD/MM/YYYY -> YYYY-MM-DD cho API
                ['start_date','due_date'].forEach(k => {
                    if (data[k] && data[k].includes('/')) {
                        const [d,m,y] = data[k].split('/');
                        data[k] = `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
                    }
                });
                data.unit_id = SESSION.unit.unit_id;
                // Thu thập noti_user từ các checkbox
                const notiChecked = Array.from(document.querySelectorAll('.noti-user-cb:checked')).map(cb => cb.value);
                data.noti_user = notiChecked.join(',');
                // Thu thập repeat_yn (checkbox toggle)
                data.repeat_yn = document.getElementById('cb_repeat_yn')?.checked ? 1 : 0;
                // Thu thập over_time (checkbox toggle Tăng ca)
                data.over_time = document.getElementById('cb_over_time')?.checked ? 1 : 0;
                const isNewTask = !data.id;
                const _now = new Date();
                const nowIso = `${_now.getDate().toString().padStart(2,'0')}/${(_now.getMonth()+1).toString().padStart(2,'0')}/${_now.getFullYear()} ${_now.getHours()}:${_now.getMinutes().toString().padStart(2,'0')}:${_now.getSeconds().toString().padStart(2,'0')}`;

                // Người tạo (user_id0): chỉ gán lần đầu tạo mới
                if (isNewTask) {
                    data.user_id0 = SESSION.user.user_id;
                }
                // Người sửa gần nhất (user_id2): gán mỗi lần lưu
                data.user_id2 = SESSION.user.user_id;

                // datetime2: thời điểm sửa gần nhất
                data.datetime2 = nowIso;
                if (!isNewTask) {

                    // Kiểm tra thay đổi due_date so với task gốc
                    const origTask = ALL_TASKS.find(t => String(t.id) === String(data.id));
                    if (origTask && origTask.due_date && data.due_date) {
                        // So sánh qua timestamp để tránh khác biệt format
                        const origDueTs = parseLocalDate(origTask.due_date)?.getTime();
                        const newDueTs  = parseLocalDate(data.due_date)?.getTime();
                        if (origDueTs && newDueTs && newDueTs !== origDueTs) {
                            // Hạn chót có thay đổi -> lưu hạn chót cũ dạng YYYY-MM-DD giống due_date
                            const od = parseLocalDate(origTask.due_date);
                            data.old_due_date = `${od.getFullYear()}-${String(od.getMonth()+1).padStart(2,'0')}-${String(od.getDate()).padStart(2,'0')}`;
                        }
                        // Không thay đổi -> không set old_due_date
                    }
                }

                // Tạo apiPayload SAU khi đã xử lý hết các trường
                const apiPayload = { ...data };

                // Cập nhật UI ngay
                if (!isNewTask) {
                    const idx = ALL_TASKS.findIndex(t => String(t.id) === String(data.id));
                    if (idx > -1) ALL_TASKS[idx] = { ...ALL_TASKS[idx], ...data };
                } else {
                    data.id = '_tmp_' + Date.now();
                    ALL_TASKS.push(data);
                }
                closeModal('task-modal');
                syncTasksCache();
                if (currentMenuId === '10.01') refreshTable1001();
                else if (currentMenuId === '10.02') renderCalendar();
                // Gửi API ngầm — apiPayload.id rỗng với task mới => Apps Script tạo mới đúng
                const tmpId = data.id; // lưu lại id tạm để cập nhật sau
                fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'saveTask', data: apiPayload }) })
                    .then(r => r.json())
                    .then(result => {
                        if (result.status === 'success') {
                            // Cập nhật id thật từ server nếu là task mới
                            if (isNewTask && result.id) {
                                const idx = ALL_TASKS.findIndex(t => String(t.id) === String(tmpId));
                                if (idx > -1) {
                                    ALL_TASKS[idx].id = result.id;
                                    syncTasksCache();
                                }
                            }
                            // Lưu ý: việc tạo công việc lặp lại tuần kế tiếp (khi repeat_yn=1 và hoàn thành)
                            // được xử lý duy nhất trong saveDoneTask() ở luồng "Xong công việc",
                            // để tránh tạo trùng lặp mỗi lần sửa lại một công việc đã hoàn thành.
                        } else {
                            TASKS_DIRTY = true;
                            console.warn('saveTask warning:', result.message);
                        }
                    })
                    .catch(err => { TASKS_DIRTY = true; console.error('saveTask error:', err); });
            };
        }

            const html = `
                <div id="done-task-modal" class="modal-bg fixed inset-0 flex items-center justify-center p-3">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">

        // Tự tính lại số giờ/số phút đã làm việc từ ngày giờ bắt đầu - kết thúc
        function recalcDoneDuration() {
            const sEl = document.getElementById('dt_act_start');
            const eEl = document.getElementById('dt_act_end');
            const hEl = document.getElementById('dt_act_hours');
            const mEl = document.getElementById('dt_act_minutes');
            if (!sEl || !eEl || !hEl || !mEl || !sEl.value || !eEl.value) return;
            const start = new Date(sEl.value);
            const end = new Date(eEl.value);
            if (isNaN(start) || isNaN(end)) return;
            let diffSec = Math.round((end - start) / 1000);
            if (diffSec < 0) diffSec = 0;
            hEl.value = Math.floor(diffSec / 3600);
            mEl.value = Math.floor((diffSec % 3600) / 60);
        }

        // Lưu kết quả: ngày giờ bắt đầu -> act_start_date, ngày giờ kết thúc -> finish_date,
        // số giờ/phút đã làm việc (có thể đã điều chỉnh) -> act_time (giây), status = 5 (Hoàn thành)
        function saveDoneTask(id) {
            const startVal = document.getElementById('dt_act_start').value;
            const endVal = document.getElementById('dt_act_end').value;
            const hoursVal = parseInt(document.getElementById('dt_act_hours').value) || 0;
            const minutesVal = parseInt(document.getElementById('dt_act_minutes').value) || 0;

            if (!startVal || !endVal) { alert('Vui lòng nhập đầy đủ ngày giờ bắt đầu và kết thúc.'); return; }

            const startDate = new Date(startVal);
            const endDate = new Date(endVal);
            if (isNaN(startDate) || isNaN(endDate)) { alert('Ngày giờ không hợp lệ.'); return; }

            const act_time = hoursVal * 3600 + minutesVal * 60;
            const actStartIso = toDatetime0Str(startDate);
            const finishIso = toDatetime0Str(endDate);

            const task = ALL_TASKS.find(t => String(t.id) === String(id));
            let duration = null;
            if (task) {
                task.status = 5;
                task.act_start_date = actStartIso;
                task.finish_date = finishIso;
                task.act_time = act_time;
                // Tính số giây từ datetime0 (thời điểm tạo task) đến thời điểm hoàn thành, để tương thích dữ liệu cũ
                if (task.datetime0) {
                    const start0 = parseDatetime0(task.datetime0);
                    if (start0 && !isNaN(start0)) {
                        duration = Math.round((endDate - start0) / 1000);
                        task.duration = duration;
                    }
                }
            }
            closeModal('done-task-modal');
            refreshTable1001();
            syncTasksCache();

            // Gửi API ngầm
            const payload = { id, status: 5, act_start_date: actStartIso, finish_date: finishIso, act_time };
            if (duration !== null) payload.duration = duration;
            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'saveTask', data: payload }) })
                .then(() => {
                    TASKS_DIRTY = true;
                    // Nếu task có repeat_yn=1, tạo task mới tuần kế tiếp
                    if (task && parseInt(task.repeat_yn) === 1) {
                        const addWeeks = (dateStr, weeks) => {
                            if (!dateStr) return null;
                            const d = parseLocalDate(dateStr);
                            if (!d) return null;
                            d.setDate(d.getDate() + weeks * 7);
                            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                        };
                        const nextStart = addWeeks(task.start_date, 1);
                        const nextDue   = addWeeks(task.due_date, 1);
                        if (nextStart && nextDue) {
                            const _nr = new Date();
                            const _nrStr = toDatetime0Str(_nr);
                            const repeatPayload = {
                                task_name: task.task_name,
                                description: task.description || '',
                                project_code: task.project_code,
                                user_id: task.user_id,
                                priority: (task.priority !== undefined && task.priority !== null) ? String(task.priority) : '',
                                start_date: nextStart,
                                due_date: nextDue,
                                status: '0',
                                noti_user: task.noti_user || '',
                                repeat_yn: 1,
                                unit_id: task.unit_id || SESSION.unit.unit_id,
                                user_id0: SESSION.user.user_id,
                                user_id2: SESSION.user.user_id,
                                datetime0: _nrStr,
                                datetime2: _nrStr
                            };
                            const tmpRepId = '_tmp_repeat_' + Date.now();
                            ALL_TASKS.push({ ...repeatPayload, id: tmpRepId });
                            syncTasksCache();
                            if (currentMenuId === '10.01') refreshTable1001();
                            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'saveTask', data: repeatPayload }) })
                                .then(r => r.json())
                                .then(res2 => {
                                    if (res2.status === 'success' && res2.id) {
                                        const ri = ALL_TASKS.findIndex(t => String(t.id) === tmpRepId);
                                        if (ri > -1) { ALL_TASKS[ri].id = res2.id; syncTasksCache(); }
                                    }
                                }).catch(console.error);
                        }
                    }
                })
                .catch(() => { TASKS_DIRTY = true; });
        }

        // Parse datetime0 format: "DD/MM/YYYY H:MM:SS" -> Date object
        function parseDatetime0(str) {
            if (!str) return null;
            // Dạng ISO có chữ T: đọc thẳng ngày+giờ từ chuỗi, KHÔNG qua new Date()
            // để tránh lệch giờ do timezone máy khách khác nhau.
            if (str.includes('T')) {
                // UTC string (kết thúc Z): cộng +7h để ra giờ VN
                if (str.endsWith('Z') || (!str.includes('+') && str.lastIndexOf('-') <= 7)) {
                    const ms = Date.parse(str);
                    if (!isNaN(ms)) {
                        const vn = new Date(ms + 7 * 3600000);
                        return new Date(vn.getUTCFullYear(), vn.getUTCMonth(), vn.getUTCDate(),
                                        vn.getUTCHours(), vn.getUTCMinutes(), vn.getUTCSeconds());
                    }
                }
                // Có timezone offset (+07:00): parse phần trước T và phần giờ
                const [datePart, timePart] = str.split('T');
                const [y, m, d] = datePart.split('-').map(Number);
                const [hh, mm, ss] = (timePart || '').split(':').map(v => parseInt(v) || 0);
                return new Date(y, m - 1, d, hh, mm, ss);
            }
            // Format: DD/MM/YYYY H:MM:SS (chuỗi tự tạo trong app, không có timezone)
            const parts = str.trim().split(' ');
            if (parts.length < 2) return null;
            const [d, m, y] = parts[0].split('/').map(Number);
            const [hh, mm, ss] = parts[1].split(':').map(Number);
            if (!d || !m || !y) return null;
            return new Date(y, m - 1, d, hh || 0, mm || 0, ss || 0);
        }

        // Date -> giá trị cho input type="datetime-local" (YYYY-MM-DDTHH:MM)
        function toDatetimeLocalValue(date) {
            const pad = n => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }
        // Date -> chuỗi định dạng datetime0 dùng trong app: DD/MM/YYYY HH:MM:SS
        function toDatetime0Str(date) {
            const pad = n => String(n).padStart(2, '0');
            return `${pad(date.getDate())}/${pad(date.getMonth()+1)}/${date.getFullYear()} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        function parseLocalDate(str) {
            if (!str) return null;
            // Dạng DD/MM/YYYY (từ input người dùng nhập)
            if (str.includes('/')) {
                const [d, m, y] = str.split('/').map(Number);
                if (!d || !m || !y || y < 1000) return null;
                return new Date(y, m - 1, d);
            }
            // Dạng ISO có chữ T: đọc thẳng phần YYYY-MM-DD từ chuỗi,
            // KHÔNG qua new Date() để tránh lệch ngày do timezone máy khách.
            // VD: "2026-05-07T17:00:00.000Z" (UTC) = ngày 08/05 VN (UTC+7)
            if (str.includes('T')) {
                // UTC string (kết thúc Z, hoặc không có dấu + sau vị trí 10): cộng +7h rồi lấy ngày
                if (str.endsWith('Z') || (!str.includes('+') && str.lastIndexOf('-') <= 7)) {
                    const ms = Date.parse(str);
                    if (!isNaN(ms)) {
                        const vn = new Date(ms + 7 * 3600000);
                        return new Date(vn.getUTCFullYear(), vn.getUTCMonth(), vn.getUTCDate());
                    }
                }
                // Đã có timezone offset (+07:00): lấy phần date trước T
                const datePart = str.split('T')[0];
                const [y, m, d] = datePart.split('-').map(Number);
                return new Date(y, m - 1, d);
            }
            // Dạng YYYY-MM-DD thuần
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }
        function applyDateMask(input) {
            if (input._dateMaskApplied) return;
            input._dateMaskApplied = true;

            // Chuẩn hoá chuỗi digits thành DD/MM/YYYY
            function buildMasked(digits) {
                // digits: tối đa 8 ký tự số
                let d = digits.slice(0, 8);
                let out = d.slice(0, 2);
                if (d.length > 2) out += '/' + d.slice(2, 4);
                if (d.length > 4) out += '/' + d.slice(4, 8);
                return out;
            }

            // Lấy số chữ số trước vị trí pos trong chuỗi đã có mask
            function digitsBefore(str, pos) {
                return str.slice(0, pos).replace(/\D/g, '').length;
            }

            // Tìm vị trí con trỏ trong masked string tương ứng với nDigits chữ số
            function posAfterNDigits(masked, n) {
                let count = 0;
                for (let i = 0; i < masked.length; i++) {
                    if (/\d/.test(masked[i])) { count++; if (count === n) return i + 1; }
                }
                return masked.length;
            }

            input.addEventListener('beforeinput', function(e) {
                const v   = this.value;
                const s   = this.selectionStart;
                const end = this.selectionEnd;

                if (e.inputType === 'insertText') {
                    const ch = e.data;
                    if (!ch || !/\d/.test(ch)) { e.preventDefault(); return; }

                    // Lấy digits hiện tại, xoá phần được chọn, chèn digit mới vào đúng chỗ
                    const digitsBeforeS   = digitsBefore(v, s);
                    const digitsBeforeEnd = digitsBefore(v, end);
                    const allDigits = v.replace(/\D/g, '');
                    const newDigits = allDigits.slice(0, digitsBeforeS) + ch + allDigits.slice(digitsBeforeEnd);
                    if (newDigits.length > 8) { e.preventDefault(); return; }

                    const masked = buildMasked(newDigits);
                    e.preventDefault();
                    this.value = masked;
                    // Con trỏ đặt sau digit vừa chèn
                    const newPos = posAfterNDigits(masked, digitsBeforeS + 1);
                    this.setSelectionRange(newPos, newPos);

                } else if (e.inputType === 'deleteContentBackward') {
                    e.preventDefault();
                    const allDigits = v.replace(/\D/g, '');
                    if (s === end) {
                        // Không có selection: xoá digit ngay trước con trỏ
                        const n = digitsBefore(v, s);
                        if (n === 0) return;
                        const newDigits = allDigits.slice(0, n - 1) + allDigits.slice(n);
                        const masked = buildMasked(newDigits);
                        this.value = masked;
                        const newPos = posAfterNDigits(masked, n - 1);
                        this.setSelectionRange(newPos, newPos);
                    } else {
                        // Có selection: xoá vùng được chọn
                        const ds = digitsBefore(v, s);
                        const de = digitsBefore(v, end);
                        const newDigits = allDigits.slice(0, ds) + allDigits.slice(de);
                        const masked = buildMasked(newDigits);
                        this.value = masked;
                        const newPos = posAfterNDigits(masked, ds);
                        this.setSelectionRange(newPos, newPos);
                    }

                } else if (e.inputType === 'deleteContentForward') {
                    e.preventDefault();
                    const allDigits = v.replace(/\D/g, '');
                    if (s === end) {
                        // Xoá digit ngay sau con trỏ
                        const n = digitsBefore(v, s);
                        if (n >= allDigits.length) return;
                        const newDigits = allDigits.slice(0, n) + allDigits.slice(n + 1);
                        const masked = buildMasked(newDigits);
                        this.value = masked;
                        const newPos = posAfterNDigits(masked, n) || 0;
                        this.setSelectionRange(newPos, newPos);
                    } else {
                        const ds = digitsBefore(v, s);
                        const de = digitsBefore(v, end);
                        const newDigits = allDigits.slice(0, ds) + allDigits.slice(de);
                        const masked = buildMasked(newDigits);
                        this.value = masked;
                        const newPos = posAfterNDigits(masked, ds);
                        this.setSelectionRange(newPos, newPos);
                    }
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Tab') { autoFillDate(this); }
            });

            input.addEventListener('blur', function() { autoFillDate(this); });
        }
        function autoFillDate(input) {
            const now = new Date();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();
            let v = input.value.trim();
            if (!v) return;
            // Chỉ có ngày (1-2 ký tự số, hoặc DD)
            const digits = v.replace(/\D/g, '');
            if (digits.length <= 2 && !v.includes('/')) {
                // Chỉ có ngày -> tự điền tháng/năm hiện tại
                const dd = digits.padStart(2, '0');
                input.value = `${dd}/${mm}/${yyyy}`;
            } else if (v.match(/^\d{1,2}\/\d{1,2}$/) || digits.length === 4 && v.includes('/')) {
                // Có ngày/tháng nhưng chưa có năm -> tự điền năm hiện tại
                const parts = v.split('/');
                const dd = parts[0].padStart(2, '0');
                const mo = parts[1].padStart(2, '0');
                input.value = `${dd}/${mo}/${yyyy}`;
            }
        }

        function dpToggle(input, wrapper) {

        function dpOpen(input, wrapper) {
            dpClose(); // đóng popup cũ

            // Parse ngày hiện tại trong input (DD/MM/YYYY)
            let selDate = null;
            const val = input.value.trim();
            if (val && val.length === 10) {
                const [dd, mm, yyyy] = val.split('/');
                const d = new Date(+yyyy, +mm - 1, +dd);
                if (!isNaN(d)) selDate = d;
            }

            const viewDate = selDate ? new Date(selDate) : new Date();
            const state = { input, wrapper, viewDate, selDate, view: 'days' }; // view: 'days'|'months'|'years'

            const popup = document.createElement('div');
            popup.className = 'dp-popup';
            // Căn lề phải nếu gần cạnh phải màn hình
            const rect = wrapper.getBoundingClientRect();
            if (rect.left + 290 > window.innerWidth) popup.classList.add('dp-align-right');

            state.popup = popup;
            wrapper.appendChild(popup);
            _dpActive = state;

            dpRender(state);

            // Đóng khi click ngoài
            setTimeout(() => {
                document.addEventListener('mousedown', dpOutsideHandler, { capture: true });
            }, 0);
        }

        function dpOutsideHandler(e) {

            if (_dpActive.popup && !_dpActive.popup.contains(e.target) && !_dpActive.wrapper.contains(e.target)) {

            }
        }

        function dpClose() {
            if (!_dpActive) return;
            if (_dpActive.popup && _dpActive.popup.parentNode) _dpActive.popup.parentNode.removeChild(_dpActive.popup);

        // Lấy tất cả task trong khoảng ngày (không lọc status) để tính trượt/dời deadline
        function getReport100502AllTasks(fromStr, toStr) {
            const fromDate = parseLocalDate(fromStr);
            const toDate   = parseLocalDate(toStr);
            // Task có finish_date trong khoảng (bao gồm task hoàn thành)
            // HOẶC task chưa hoàn thành nhưng có due_date trong khoảng
            return ALL_TASKS.filter(t => {
                if (t.finish_date) {
                    const fd = parseDatetime0(t.finish_date);
                    if (fd) {
                        const fdDate = new Date(fd.getFullYear(), fd.getMonth(), fd.getDate());
                        if ((!fromDate || fdDate >= fromDate) && (!toDate || fdDate <= toDate)) return true;
                    }
                }
                if (t.due_date) {
                    const dd = parseLocalDate(t.due_date);
                    if (dd && (!fromDate || dd >= fromDate) && (!toDate || dd <= toDate)) return true;
                }
                return false;
            });
        }

        function calcTaskStats(tasks) {
            // Số task hoàn thành (status=5)
            const done = tasks.filter(t => t.status == 5).length;
            // Số task trượt deadline: finish_date > due_date
            const missDeadline = tasks.filter(t => {
                if (!t.finish_date || !t.due_date) return false;
                const fd = parseDatetime0(t.finish_date);
                const dd = parseLocalDate(t.due_date);
                if (!fd || !dd) return false;
                const fdDay = new Date(fd.getFullYear(), fd.getMonth(), fd.getDate());
                return fdDay > dd;
            }).length;
            // Số task dời deadline: có tồn tại giá trị old_due_date
            const extDeadline = tasks.filter(t => t.old_due_date && String(t.old_due_date).trim() !== '').length;
            // Tổng giờ act_time
            const hours = tasks.reduce((s,t) => s + (parseFloat(t.act_time)||0), 0) / 3600;
            return { total: tasks.length, done, missDeadline, extDeadline, hours };
        }

        // Queue để tránh concurrent write conflicts
        let _outofficeWriteQueue = Promise.resolve();
        function queueOutofficeWrite(fn) {
            _outofficeWriteQueue = _outofficeWriteQueue.then(fn).catch(console.error);
            return _outofficeWriteQueue;
        }

        // Retry fetch với exponential backoff
        async function fetchWithRetry(url, options, retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url, options);
                    const result = await res.json();
                    return result;
                } catch(e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, 300 * Math.pow(2, i)));
                }
            }
        }

        async function loadOutoffice(force = false) {
            if (!force && !OUTOFFICE_DIRTY) return;
            try {
                const result = await fetchWithRetry(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getOutOffice', data: { filters: { unit_id: SESSION.unit.unit_id } } })
                });
                ALL_OUTOFFICE = result.data || [];
                if (ALL_OUTOFFICE.length > 0) {
                    console.log('[DEBUG] full record[0]:', JSON.stringify(ALL_OUTOFFICE[0]));

        function formatOutofficeTime(t) {
            if (!t && t !== 0) return '';

            // --- Trường hợp 1: Số thập phân (GSheet Time serial, e.g. 0.3333 = 08:00) ---
            if (typeof t === 'number') {
                const totalMin = Math.round(t * 24 * 60);
                const hh = Math.floor(totalMin / 60) % 24;
                const mm = totalMin % 60;
                return `${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}`;
            }

            // --- Trường hợp 2: Chuỗi ---
            if (typeof t === 'string') {
                const s = t.trim();

                // "HH:mm" hoặc "HH:mm:ss" — đã đúng, trả thẳng
                if (/^\d{1,2}:\d{2}/.test(s)) return s.substring(0, 5);

                // ISO epoch GSheet: "1899-12-30T..." hoặc "1899-12-29T..."
                // Apps Script serialize Time cell thành UTC ISO.
                // Spreadsheet timezone VN (UTC+7): 08:00 ICT → 01:00 UTC → "1899-12-30T01:00:00Z"
                // → lấy giờ UTC rồi cộng +7h để ra giờ VN
                if (s.startsWith('1899-12-30') || s.startsWith('1899-12-29')) {
                    const d = new Date(s);
                    if (!isNaN(d)) {
                        const hh = (d.getUTCHours() + 7) % 24;
                        const mm = d.getUTCMinutes();
                        return `${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}`;
                    }
                }

                // ISO thông thường có T (e.g. "2025-01-01T08:00:00+07:00")
                if (s.includes('T')) {
                    const d = new Date(s);
                    if (!isNaN(d)) {
                        // Dùng giờ local của trình duyệt (đã có timezone offset trong chuỗi)
                        return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                    }
                }

                return s.substring(0, 5);
            }

            // --- Trường hợp 3: Date object ---
            if (t instanceof Date) {
                // Apps Script trả Date object (trước khi JSON) → getUTCH + 7
                return `${((t.getUTCHours() + 7) % 24).toString().padStart(2,'0')}:${t.getUTCMinutes().toString().padStart(2,'0')}`;
            }

            return String(t).substring(0, 5);
        }

        // Parse ngày outoffice về YYYY-MM-DD theo giờ Việt Nam (UTC+7)
        // Tránh lỗi lệch ngày khi API trả ISO string dạng UTC (e.g. 2025-05-07T17:00:00Z = 08/05 VN)
        function parseOutofficeDateVN(d) {
            if (!d) return '';
            if (d instanceof Date) {
                // Cộng offset +7h rồi lấy ngày
                const vn = new Date(d.getTime() + 7 * 3600000);
                return vn.toISOString().slice(0, 10);
            }
            if (typeof d === 'string') {
                // Dạng DD/MM/YYYY
                if (d.includes('/')) {
                    const [dd, mm, yyyy] = d.split('/');
                    return `${yyyy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
                }
                // Dạng ISO có timezone offset, e.g. 2025-05-08T00:00:00+07:00
                if (d.includes('+') && d.includes('T')) {
                    // Lấy phần date trước T - đây chính là ngày local
                    return d.split('T')[0];
                }
                // Dạng ISO UTC, e.g. 2025-05-07T17:00:00.000Z -> cộng 7h
                if (d.endsWith('Z') || (d.includes('T') && !d.includes('+'))) {
                    const ms = Date.parse(d);
                    if (!isNaN(ms)) {
                        const vn = new Date(ms + 7 * 3600000);
                        return vn.toISOString().slice(0, 10);
                    }
                }
                // Dạng YYYY-MM-DD thuần
                return d.split('T')[0];
            }
            return '';
        }

        function normOutofficeDate(d) {
            return parseOutofficeDateVN(d);
        }

        function formatOutofficeDate(d) {
            if (!d) return '-';
            const ymd = parseOutofficeDateVN(d);
            if (!ymd || ymd.length < 10) return '-';
            const [y, m, dd] = ymd.split('-');
            if (parseInt(y) <= 1900) return '-';
            return `${dd}/${m}/${y}`;
        }

        function changeOutofficeMonth(s) {
            currentOutofficeDate.setMonth(currentOutofficeDate.getMonth() + s);
            renderOutofficeCalendar();
        }

            openOutofficeForm(null, prefilled);
        }

                                        <option value="2" ${rec?.type == 2 ? 'selected' : ''}>💼 Làm việc ngoài</option>
                                        <option value="3" ${rec?.type == 3 ? 'selected' : ''}>🤝 Đi họp</option>

                            </div>

                            <div>

                            </div>
