<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Công việc - ARITO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .hidden { display: none; }
        .modal-bg { background-color: rgba(0,0,0,0.6); z-index: 100; }
        #confirm-modal { z-index: 200; }
        .active-menu { background-color: #2563eb !important; border-left: 4px solid #fff; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .multi-select-box { max-height: 150px; overflow-y: auto; border: 1px solid #ddd; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <script>
        // Link API của bạn
        const API_URL = 'https://script.google.com/macros/s/AKfycbwtj9hbk4gRWQ8lDA8PlEzcBkpCHGDtwLGO3QO6bjmXXJ6sRKjs6IrtBtujrSDmnNksUQ/exec';
    </script>

    <div id="login-screen" class="hidden min-h-screen flex items-center justify-center bg-slate-900">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-blue-600">
            <h2 class="text-3xl font-black mb-8 text-center text-slate-800 tracking-tight">TASK SYSTEM</h2>
            <div class="space-y-4">
                <input type="text" id="unit_name" class="w-full p-3 border-2 rounded-xl focus:border-blue-500 outline-none transition" placeholder="Mã đơn vị">
                <input type="text" id="username" class="w-full p-3 border-2 rounded-xl focus:border-blue-500 outline-none transition" placeholder="Tên đăng nhập">
                <input type="password" id="password" class="w-full p-3 border-2 rounded-xl focus:border-blue-500 outline-none transition" placeholder="Mật khẩu">
                <button onclick="handleLogin()" id="login-btn" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold hover:bg-blue-700 shadow-lg transform active:scale-95 transition">ĐĂNG NHẬP</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden flex h-screen overflow-hidden">
        <div class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl">
            <div class="p-6 text-2xl font-black text-blue-400 border-b border-slate-800">TASK TRACKER</div>
            <nav id="sidebar-menu" class="flex-1 mt-4 px-3 space-y-2"></nav>
            <div class="p-4 bg-slate-800 border-t border-slate-700">
                <div id="user-display" class="font-bold text-blue-300"></div>
                <button onclick="logout()" class="text-red-400 hover:text-red-300 text-xs font-bold mt-2 uppercase tracking-widest">Đăng xuất</button>
            </div>
        </div>

        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow-sm p-5 border-b flex justify-between items-center">
                <h2 id="page-title" class="text-xl font-extrabold text-slate-700 uppercase tracking-tight"></h2>
            </header>
            <main class="flex-1 overflow-auto p-6 scrollbar-hide" id="main-content"></main>
        </div>
    </div>

    <div id="confirm-modal" class="modal-bg fixed inset-0 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
            <div class="w-16 h-16 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">!</div>
            <h3 id="confirm-title" class="text-xl font-bold mb-2">Xác nhận</h3>
            <p id="confirm-msg" class="text-gray-500 mb-6 text-sm"></p>
            <div class="flex space-x-3">
                <button onclick="closeConfirm(false)" class="flex-1 py-3 bg-gray-100 rounded-xl font-bold">Hủy</button>
                <button id="confirm-ok-btn" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg">Đồng ý</button>
            </div>
        </div>
    </div>

    <div id="modal-area"></div> 

    <script>
        let SESSION = null;
        let ALL_TASKS = [];
        let MASTER_DATA = { projects: [], priorities: [], statuses: [], users: [] };
        let currentCalDate = new Date();
        let confirmCallback = null;
        let TASKS_DIRTY = true;
        let currentMenuId = null;

        function showConfirm(title, msg, callback) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-msg').innerText = msg;
            document.getElementById('confirm-modal').classList.remove('hidden');
            confirmCallback = callback;
            document.getElementById('confirm-ok-btn').onclick = () => { closeConfirm(true); };
        }
        function closeConfirm(isOk) {
            document.getElementById('confirm-modal').classList.add('hidden');
            if (isOk && confirmCallback) confirmCallback();
        }

        async function handleLogin() {
            const data = { action: 'login', data: {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                unit_name: document.getElementById('unit_name').value
            }};
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });
                const result = await res.json();
                if (result.status === 'success') {
                    SESSION = result;
                    localStorage.setItem('arito_qlcv_session', JSON.stringify(result));
                    initApp();
                } else { alert("Sai thông tin đăng nhập!"); }
            } catch (e) { alert("Lỗi kết nối API. Vui lòng kiểm tra lại Link App Script."); }
        }

        async function initApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-display').innerText = SESSION.user.fullname;
            
            const menuHtml = SESSION.menus.map(m => `
                <a href="javascript:void(0)" onclick="switchMenu('${m.menu_id}', '${m.text}')" 
                   id="menu-${m.menu_id}" class="sidebar-item flex items-center p-4 rounded-xl text-sm font-bold transition">
                   ${m.text}
                </a>`).join('');
            document.getElementById('sidebar-menu').innerHTML = menuHtml;

            const resData = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getInitialData' }) });
            MASTER_DATA = await resData.json();
            
            switchMenu('10.01', 'Tổng hợp công việc');
        }

        async function switchMenu(menuId, text) {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active-menu'));
            document.getElementById(`menu-${menuId}`)?.classList.add('active-menu');
            document.getElementById('page-title').innerText = text;
            currentMenuId = menuId;

            if (TASKS_DIRTY) {
                const main = document.getElementById('main-content');
                main.innerHTML = '<div class="flex justify-center mt-20"><div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div></div>';
                try {
                    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getTasks', data: { unit_id: SESSION.unit.unit_id } })});
                    const result = await res.json();
                    ALL_TASKS = result.data;
                    TASKS_DIRTY = false;
                } catch(e) { console.error('Lỗi tải dữ liệu:', e); }
            }

            if (menuId === '10.01') renderTable1001();
            else if (menuId === '10.02') renderCalendar();
            else if (menuId === '10.03') renderDashboard();
            else if (menuId === '10.04') renderProjectList();
        }

        // --- 10.01 TỔNG HỢP CÔNG VIỆC ---
        function renderTable1001() {
            const container = document.getElementById('main-content');
            const filtered = ALL_TASKS.filter(t => t.user_id == SESSION.user.user_id && (t.status == 0 || t.status == 3));

            container.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border mb-6">
                    <div class="flex flex-wrap gap-4 items-end">
                        <div class="flex-1 min-w-[200px]">
                            <label class="text-[10px] font-black text-slate-400 uppercase">Tìm kiếm nhanh</label>
                            <input type="text" id="quick_search" onkeyup="doQuickSearch()" placeholder="Tên việc, dự án..." class="w-full p-2.5 border-2 rounded-xl text-sm outline-none focus:border-blue-400">
                        </div>
                        <button onclick="toggleAdvance('task')" class="px-5 py-2.5 bg-slate-100 rounded-xl font-bold text-sm">Tìm nâng cao</button>
                        <button onclick="openTaskForm()" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl font-bold shadow-lg hover:shadow-blue-200">THÊM MỚI +</button>
                    </div>
                    
                    <div id="adv-filter-task" class="hidden mt-6 pt-6 border-t grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="space-y-1">
                            <label class="text-xs font-bold uppercase">Ngày tạo (Từ - Đến)</label>
                            <div class="flex gap-2"><input type="text" id="adv_c_start" class="date-mask w-full p-2 border rounded-lg text-xs" placeholder="DD/MM/YYYY" maxlength="10"><input type="text" id="adv_c_end" class="date-mask w-full p-2 border rounded-lg text-xs" placeholder="DD/MM/YYYY" maxlength="10"></div>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold uppercase">Hạn chót (Từ - Đến)</label>
                            <div class="flex gap-2"><input type="text" id="adv_d_start" class="date-mask w-full p-2 border rounded-lg text-xs" placeholder="DD/MM/YYYY" maxlength="10"><input type="text" id="adv_d_end" class="date-mask w-full p-2 border rounded-lg text-xs" placeholder="DD/MM/YYYY" maxlength="10"></div>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold uppercase">Trạng thái (Chọn nhiều)</label>
                            <div class="multi-select-box text-xs" id="adv_st_list">
                                ${MASTER_DATA.statuses.map(s => `<label class="block p-1 hover:bg-gray-50"><input type="checkbox" value="${s.status_code}" ${(s.status_code == 0 || s.status_code == 3) ? 'checked' : ''}> ${s.status_name}</label>`).join('')}
                            </div>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold uppercase">Dự án</label>
                            <select id="adv_project" class="w-full p-2 border rounded-lg text-xs">
                                <option value="">-- Tất cả dự án --</option>
                                ${MASTER_DATA.projects.map(p => `<option value="${p.project_code}">${p.project_code} - ${p.project_name}</option>`).join('')}
                            </select>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold uppercase">Người thực hiện</label>
                            <select id="adv_user" class="w-full p-2 border rounded-lg text-xs">
                                <option value="">-- Tất cả người dùng --</option>
                                ${MASTER_DATA.users.map(u => `<option value="${u.user_id}">${u.username}</option>`).join('')}
                            </select>
                        </div>
                        <div class="flex items-end"><button onclick="applyTaskFilter()" class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold text-sm">ÁP DỤNG BỘ LỌC</button></div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b">
                            <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                <th class="p-5">Dự án</th>
                                <th class="p-5">Chi tiết công việc</th>
                                <th class="p-5 text-center">Bắt đầu</th>
                                <th class="p-5 text-center">Hạn chót</th>
                                <th class="p-5 text-center">Trạng thái</th>
                                <th class="p-5 text-right">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y" id="task-table-body">${renderTaskRows(filtered)}</tbody>
                    </table>
                </div>`;
            initDateMasks();
        }

        function renderTaskRows(tasks) {
            return tasks.map(t => `
                <tr class="hover:bg-blue-50/50 cursor-pointer transition" onclick="openTaskForm(${JSON.stringify(t).replace(/"/g, '&quot;')})">
                    <td class="p-5 font-bold text-blue-600 text-sm">${t.project_code}</td>
                    <td class="p-5">
                        <div class="font-bold text-slate-800">${t.task_name}</div>
                        <div class="text-xs text-slate-400 font-medium">${getUserName(t.user_id)}</div>
                    </td>
                    <td class="p-5 text-center text-xs text-slate-500">${formatDate(t.start_date)}</td>
                    <td class="p-5 text-center text-xs font-black text-orange-600">${formatDate(t.due_date)}</td>
                    <td class="p-5 text-center">
                        <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${getStatusColor(t.status)}">${getStatusName(t.status)}</span>
                    </td>
                    <td class="p-5 text-right" onclick="event.stopPropagation()">
                        ${t.status != 5 ? `<button onclick="doQuickDone('${t.id}')" class="bg-emerald-500 text-white px-3 py-1 rounded-lg text-[10px] font-black shadow-lg">XONG</button>` : '✅'}
                    </td>
                </tr>
            `).join('');
        }

        async function applyTaskFilter() {
            const stList = Array.from(document.querySelectorAll('#adv_st_list input:checked')).map(i => i.value);
            const cStart = document.getElementById('adv_c_start').value;
            const cEnd = document.getElementById('adv_c_end').value;
            const dStart = document.getElementById('adv_d_start').value;
            const dEnd = document.getElementById('adv_d_end').value;
            const projectCode = document.getElementById('adv_project').value;
            const userId = document.getElementById('adv_user').value;

            const filtered = ALL_TASKS.filter(t => {
                const matchStatus = stList.length === 0 || stList.includes(String(t.status));
                const matchProject = !projectCode || t.project_code === projectCode;
                const matchUser = !userId || String(t.user_id) === String(userId);
                
                let matchC = true;
                if (t.datetime0) {
                    const dateC = parseLocalDate(t.datetime0);
                    if (cStart && dateC < parseLocalDate(cStart)) matchC = false;
                    if (cEnd && dateC > parseLocalDate(cEnd)) matchC = false;
                }

                let matchD = true;
                if (t.due_date) {
                    const dateD = parseLocalDate(t.due_date);
                    if (dStart && dateD < parseLocalDate(dStart)) matchD = false;
                    if (dEnd && dateD > parseLocalDate(dEnd)) matchD = false;
                }
                return matchStatus && matchProject && matchUser && matchC && matchD;
            });
            document.getElementById('task-table-body').innerHTML = renderTaskRows(filtered);
            toggleAdvance('task');
        }

        // --- 10.02 LỊCH ---
        function renderCalendar(dataToRender = null) {
            const container = document.getElementById('main-content');
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const tasksToDisplay = dataToRender || ALL_TASKS.filter(t => (t.status == 0 || t.status == 3) && String(t.user_id) === String(SESSION.user.user_id));

            container.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border mb-6">
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex gap-2">
                            <button onclick="changeMonth(-1)" class="w-10 h-10 bg-gray-50 rounded-xl border flex items-center justify-center font-bold">◀</button>
                            <h3 class="text-2xl font-black text-slate-800 px-4 flex items-center">THÁNG ${(month+1)} / ${year}</h3>
                            <button onclick="changeMonth(1)" class="w-10 h-10 bg-gray-50 rounded-xl border flex items-center justify-center font-bold">▶</button>
                        </div>
                        <button onclick="toggleAdvance('cal')" class="px-5 py-2.5 bg-slate-100 rounded-xl font-bold text-sm">Bộ lọc lịch</button>
                    </div>
                    
                    <div id="adv-filter-cal" class="hidden mb-8 p-6 bg-slate-50 rounded-2xl grid grid-cols-4 gap-4 border">
                        <div><label class="text-xs font-bold uppercase">Hạn từ - Đến</label><div class="flex gap-2"><input type="text" id="cal_d_start" class="date-mask w-full p-2 border rounded-lg text-xs" placeholder="DD/MM/YYYY" maxlength="10"><input type="text" id="cal_d_end" class="date-mask w-full p-2 border rounded-lg text-xs" placeholder="DD/MM/YYYY" maxlength="10"></div></div>
                        <div><label class="text-xs font-bold uppercase">Người làm</label><select id="cal_user" class="w-full p-2 border rounded-lg text-xs"><option value="">Tất cả</option>${MASTER_DATA.users.map(u => `<option value="${u.user_id}" ${String(u.user_id) === String(SESSION.user.user_id) ? 'selected' : ''}>${u.username}</option>`).join('')}</select></div>
                        <div><label class="text-xs font-bold uppercase">Trạng thái</label><div class="multi-select-box text-[10px]" id="cal_st_list">${MASTER_DATA.statuses.map(s => `<label class="block"><input type="checkbox" value="${s.status_code}" ${(s.status_code == 0 || s.status_code == 3) ? 'checked' : ''}> ${s.status_name}</label>`).join('')}</div></div>
                        <div class="flex items-end"><button onclick="applyCalFilter()" class="w-full py-2.5 bg-blue-600 text-white rounded-xl font-bold text-sm">LỌC LỊCH</button></div>
                    </div>

                    <div class="grid grid-cols-7 gap-px bg-slate-200 border rounded-xl overflow-hidden shadow-inner">
                        ${['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'].map(d => `<div class="bg-slate-50 p-3 text-center font-black text-[10px] text-slate-400">${d}</div>`).join('')}
                        ${Array(firstDay).fill('').map(() => `<div class="bg-slate-50 p-2 h-32"></div>`).join('')}
                        ${Array.from({length: daysInMonth}, (_, i) => {
                            const d = i + 1;
                            const dStr = `${year}-${(month+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
                            const cellDate = new Date(year, month, d);
                            const todayMid = new Date(); todayMid.setHours(0,0,0,0);
                            const isOverdueCell = cellDate < todayMid;
                            const dayTasks = tasksToDisplay.filter(t => t.due_date && t.due_date.startsWith(dStr));
                            return `<div class="bg-white p-2 h-32 border-t hover:bg-blue-50/50 cursor-pointer overflow-y-auto">
                                <div class="text-xs font-black mb-1 ${(d == new Date().getDate() && month == new Date().getMonth() && year == new Date().getFullYear()) ? 'text-blue-600 bg-blue-50 w-6 h-6 flex items-center justify-center rounded-full' : ''}">${d}</div>
                                ${dayTasks.map(t => {
                                    const isOverdue = isOverdueCell && t.status != 5;
                                    const chipCls = isOverdue
                                        ? 'bg-rose-100 text-rose-700 border border-rose-300'
                                        : 'bg-blue-100 text-blue-700';
                                    return `<div class="text-[8px] ${chipCls} p-1 mb-0.5 rounded-md font-bold truncate" onclick="openTaskForm(${JSON.stringify(t).replace(/"/g,'&quot;')})">(${t.project_code}) ${t.task_name}</div>`;
                                }).join('')}
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            initDateMasks();
        }

        async function applyCalFilter() {
            const stList = Array.from(document.querySelectorAll('#cal_st_list input:checked')).map(i => i.value);
            const uId = document.getElementById('cal_user').value;
            const dStart = document.getElementById('cal_d_start').value;
            const dEnd = document.getElementById('cal_d_end').value;

            const filtered = ALL_TASKS.filter(t => {
                const matchStatus = stList.length === 0 || stList.includes(String(t.status));
                const matchUser = !uId || t.user_id == uId;
                
                let matchD = true;
                if (t.due_date) {
                    const dateD = parseLocalDate(t.due_date);
                    if (dStart && dateD < parseLocalDate(dStart)) matchD = false;
                    if (dEnd && dateD > parseLocalDate(dEnd)) matchD = false;
                }
                return matchStatus && matchUser && matchD;
            });
            renderCalendar(filtered); 
            toggleAdvance('cal');
        }

        // --- 10.03 DASHBOARD ---
        function renderDashboard(filterProject = '', filterUser = null) {
            const container = document.getElementById('main-content');
            const now = new Date();
            now.setHours(0,0,0,0);
            const weekLater = new Date(now); weekLater.setDate(weekLater.getDate() + 7);

            // null = lần đầu vào -> mặc định user hiện tại; '' = chọn Tất cả -> không lọc
            const activeUser = (filterUser === null) ? String(SESSION.user.user_id) : filterUser;

            // Lọc tập dữ liệu theo filter
            const base = ALL_TASKS.filter(t => {
                const matchProject = !filterProject || t.project_code === filterProject;
                const matchUser = !activeUser || String(t.user_id) === activeUser;
                return matchProject && matchUser;
            });

            // KPI trên tập đã lọc
            const total    = base.length;
            const done     = base.filter(t => t.status == 5).length;
            const inprog   = base.filter(t => t.status == 3).length;
            const notstart = base.filter(t => t.status == 0).length;
            const overdueList = base.filter(t => t.status != 5 && t.due_date && new Date(t.due_date.split('T')[0]) < now);
            const overdue  = overdueList.length;
            const upcomingList = base.filter(t => {
                if (t.status == 5 || !t.due_date) return false;
                const d = new Date(t.due_date.split('T')[0]);
                return d >= now && d <= weekLater;
            }).sort((a,b) => new Date(a.due_date) - new Date(b.due_date));

            // Chart data trên tập đã lọc
            const byProject = {};
            base.forEach(t => { byProject[t.project_code] = (byProject[t.project_code] || 0) + 1; });
            const statusCount = {};
            MASTER_DATA.statuses.forEach(s => { statusCount[s.status_name] = base.filter(t => String(t.status) === String(s.status_code)).length; });

            const taskTableRow = (t, rowColor) => `
                <tr class="hover:bg-opacity-60 cursor-pointer ${rowColor}" onclick="openTaskForm(${JSON.stringify(t).replace(/"/g,'&quot;')})">
                    <td class="p-3 font-bold text-blue-600 text-xs">${t.project_code}</td>
                    <td class="p-3 font-medium text-slate-800 text-xs">${t.task_name}</td>
                    <td class="p-3 text-xs text-slate-500">${getUserName(t.user_id)}</td>
                    <td class="p-3 text-center text-xs font-black">${formatDate(t.due_date)}</td>
                    <td class="p-3 text-center"><span class="px-2 py-0.5 rounded-full text-[9px] font-black uppercase ${getStatusColor(t.status)}">${getStatusName(t.status)}</span></td>
                </tr>`;

            const tableHead = `<thead class="bg-slate-50 border-b"><tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                <th class="p-3">Dự án</th><th class="p-3">Tên công việc</th><th class="p-3">Người làm</th><th class="p-3 text-center">Hạn chót</th><th class="p-3 text-center">Trạng thái</th>
            </tr></thead>`;

            container.innerHTML = `
                <div class="space-y-4">
                    <!-- Bộ lọc Dashboard -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm border">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                            <div>
                                <label class="text-[10px] font-black uppercase text-slate-400">Dự án</label>
                                <select id="db_project" class="w-full p-2.5 border-2 rounded-xl text-sm outline-none focus:border-blue-400">

                    const idx = ALL_TASKS.findIndex(t => String(t.id) === String(data.id));

        // Parse datetime0 format: "DD/MM/YYYY H:MM:SS" -> Date object
        function parseDatetime0(str) {
            if (!str) return null;
            // Thử ISO trước (fallback)
            if (str.includes('T')) return new Date(str);
            // Format: DD/MM/YYYY H:MM:SS
            const parts = str.trim().split(' ');
            if (parts.length < 2) return null;
            const [d, m, y] = parts[0].split('/').map(Number);
            const [hh, mm, ss] = parts[1].split(':').map(Number);
            if (!d || !m || !y) return null;
            return new Date(y, m - 1, d, hh || 0, mm || 0, ss || 0);
        }

        function parseLocalDate(str) {
            if (!str) return null;
            // Support DD/MM/YYYY format from text inputs
            if (str.includes('/')) {
                const [d, m, y] = str.split('/').map(Number);
                if (!d || !m || !y || y < 1000) return null;
                return new Date(y, m - 1, d);
            }
            const [y, m, d] = str.split('T')[0].split('-').map(Number);
            return new Date(y, m - 1, d);
        }
        function applyDateMask(input) {
            // Dùng beforeinput để kiểm soát chính xác từng ký tự
            input.addEventListener('beforeinput', function(e) {
                // Chỉ xử lý khi gõ 1 ký tự
                if (e.inputType !== 'insertText') return;
                const ch = e.data;
                if (!ch) return;

                const v   = this.value;
                const s   = this.selectionStart;
                const end = this.selectionEnd;

                // Nếu đang gõ ký tự không phải số -> chặn
                if (!/\d/.test(ch)) { e.preventDefault(); return; }

                // Nếu field đã đủ 10 ký tự DD/MM/YYYY và không có text được chọn -> chặn
                if (v.length >= 10 && s === end) { e.preventDefault(); return; }

                // Tính value mới sau khi chèn ký tự
                let newVal = v.slice(0, s) + ch + v.slice(end);

                // Tự động chèn dấu / ở vị trí 2 và 5
                if (newVal.length === 3 && newVal[2] !== '/') {
                    newVal = newVal.slice(0,2) + '/' + newVal.slice(2);
                }
                if (newVal.length === 6 && newVal[5] !== '/') {
                    newVal = newVal.slice(0,5) + '/' + newVal.slice(5);
                }

                // Validate: không vượt quá DD/MM/YYYY
                if (newVal.replace(/\D/g,'').length > 8) { e.preventDefault(); return; }

                e.preventDefault();
                this.value = newVal;
                // Đặt con trỏ sau ký tự vừa gõ (bỏ qua dấu /)
                let newPos = s + 1;
                if (newVal[newPos] === '/') newPos++;
                this.setSelectionRange(newPos, newPos);
            });

            // Xử lý Backspace qua dấu /
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Tab') { autoFillDate(this); return; }
                if (e.key === 'Backspace' && this.selectionStart === this.selectionEnd) {
                    const pos = this.selectionStart;
                    if (this.value[pos-1] === '/') {
                        e.preventDefault();
                        const v = this.value;
                        this.value = v.slice(0, pos-1) + v.slice(pos);
                        this.setSelectionRange(pos-1, pos-1);
                    }
                }
            });

            input.addEventListener('blur', function() { autoFillDate(this); });
        }
        function autoFillDate(input) {
            const now = new Date();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();
            let v = input.value.trim();
            if (!v) return;
            // Chỉ có ngày (1-2 ký tự số, hoặc DD)
            const digits = v.replace(/\D/g, '');
            if (digits.length <= 2 && !v.includes('/')) {
                // Chỉ có ngày -> tự điền tháng/năm hiện tại
                const dd = digits.padStart(2, '0');
                input.value = `${dd}/${mm}/${yyyy}`;
            } else if (v.match(/^\d{1,2}\/\d{1,2}$/) || digits.length === 4 && v.includes('/')) {
                // Có ngày/tháng nhưng chưa có năm -> tự điền năm hiện tại
                const parts = v.split('/');
                const dd = parts[0].padStart(2, '0');
                const mo = parts[1].padStart(2, '0');
                input.value = `${dd}/${mo}/${yyyy}`;
            }
        }
        function initDateMasks() {
            document.querySelectorAll('.date-mask').forEach(applyDateMask);
        }
        function formatDate(d) {
            if (!d) return '-';
            const date = parseLocalDate(d);
            return `${date.getDate().toString().padStart(2,'0')}/${(date.getMonth()+1).toString().padStart(2,'0')}/${date.getFullYear()}`;
        }
        function getUserName(id) { return MASTER_DATA.users.find(u => u.user_id == id)?.username || 'N/A'; }
        function getStatusName(c) { return MASTER_DATA.statuses.find(s => s.status_code == c)?.status_name || 'N/A'; }
        function getStatusColor(c) {
            if (c == 5) return 'bg-emerald-100 text-emerald-700';
            if (c == 3) return 'bg-blue-100 text-blue-700';
            if (c == 0) return 'bg-rose-100 text-rose-700';
            return 'bg-slate-100 text-slate-700';
        }
        function logout() { localStorage.removeItem('arito_qlcv_session'); location.reload(); }

        // Khôi phục session khi F5 / mở lại tab
        (function restoreSession() {
            try {
                const saved = localStorage.getItem('arito_qlcv_session');
                if (saved) {
                    SESSION = JSON.parse(saved);
                    if (SESSION && SESSION.status === 'success' && SESSION.user && SESSION.unit) {
                        initApp();
                        return;
                    }
                }
            } catch(e) {}
            // Không có session hợp lệ -> hiển thị màn hình đăng nhập
            document.getElementById('login-screen').classList.remove('hidden');
        })();

    </script>
